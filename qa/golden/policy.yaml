# Held-update table (the QA plan's oracle "Held updates"; traceability `policy.table`), bound to
# the contract §5.3 (the owner's decision). Hand-written: for each case, the one outcome
# `update_installed_skills` must give. A unit test runs every row against the update hold; an interface test
# runs a sample through the CLI with a real lock file (SKILLS_SYNC_ON_START=0 so the test controls sync).
#
# policy: the global default; override: per skill (none = inherit). The effective policy is the override when set.
# flags: the risk_flags the newest version raises against the installed one (contract §5.3):
#   from the diff: runnable_file, runs_at_load, capability_frontmatter, instructions_changed, non_markdown, new_publisher
#   (which change raises which flag: histories.yaml `gate`);
#   from the rules reviewer, run by the installer on the fetched version: prompt_injection, context_cost.
#   [] = a markdown-only change with no reviewer findings. `newer: false` = no newer version.
# local: same | changed_here. Phase 1 (the owner's decision; contract §5.4): nothing checks for local changes and an update replaces the installed copy, so
#   `outcome` ignores `local`. `if_protected` is the outcome if the owner later picks protection.
# accept: the setup option accept_flagged_updates (default false).
# mode: interactive | unattended (unattended holds are reported at the next session).
# outcome: updated | unchanged | installed | held:pin | held:notify | held:flagged
# Precedence: pin, then notify, then the risk-flag hold.
# first_install: true = an install from nothing (contract §5.3): it follows the auto rows whatever the policy, so no flags
#   installs and any flag is held:flagged, then accept_held_update with its confirm installs it.

cases:
  - {policy: auto,   override: none,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: updated}
  - {policy: auto,   override: none,   flags: [],                       local: same,         accept: false, mode: unattended,  outcome: updated}
  - {policy: auto,   override: none,   flags: [non_markdown],           local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [non_markdown],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [runnable_file],          local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [capability_frontmatter], local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [new_publisher],          local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [prompt_injection],       local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [context_cost],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [],                       local: changed_here, accept: false, mode: interactive, outcome: updated, if_protected: held:changed_here}
  - {policy: auto,   override: none,   flags: [], newer: false,         local: changed_here, accept: false, mode: interactive, outcome: unchanged, if_protected: held:changed_here}
  - {policy: auto,   override: pin,    flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:pin}
  - {policy: auto,   override: notify, flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:notify}
  - {policy: auto,   override: notify, flags: [],                       local: same,         accept: false, mode: unattended,  outcome: held:notify}
  - {policy: notify, override: none,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:notify}
  - {policy: notify, override: auto,   flags: [],                       local: same,         accept: false, mode: unattended,  outcome: updated}
  - {policy: notify, override: auto,   flags: [non_markdown],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: pin,    override: none,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:pin}
  - {policy: pin,    override: auto,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: updated}
  - {policy: auto,   override: none,   flags: [], newer: false,         local: same,         accept: false, mode: interactive, outcome: unchanged}
  - {policy: auto,   override: none,   flags: [non_markdown],           local: same,         accept: true,  mode: unattended,  outcome: updated, note: "The lock records each update the option let through"}
  - {policy: auto,   override: none,   flags: [prompt_injection],       local: same,         accept: true,  mode: unattended,  outcome: updated, note: "accept_flagged_updates covers every flag kind; the lock records it"}
  - {policy: auto,   override: none,   flags: [],                       local: changed_here, accept: true,  mode: unattended,  outcome: updated, if_protected: held:changed_here}
  - {policy: pin,    override: none,   flags: [],                       local: changed_here, accept: false, mode: interactive, outcome: held:pin, if_protected: held:changed_here}
  - {policy: notify, override: none,   flags: [runnable_file],          local: changed_here, accept: false, mode: interactive, outcome: held:notify, if_protected: held:changed_here}
  - {policy: auto,   override: pin,    flags: [non_markdown],           local: same,         accept: true,  mode: unattended,  outcome: held:pin}
  # The new diff flags (contract §5.3, f4a1df7): each holds an auto update like any other flag.
  - {policy: auto,   override: none,   flags: [runs_at_load],           local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [runs_at_load],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [instructions_changed],   local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [instructions_changed],   local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  # A first install is held like an update whatever the policy (it follows the auto rows).
  - {first_install: true, policy: pin,    override: none, flags: [],                       local: same, accept: false, mode: interactive, outcome: installed}
  - {first_install: true, policy: pin,    override: none, flags: [capability_frontmatter], local: same, accept: false, mode: interactive, outcome: held:flagged, note: "then accept_held_update with its confirm installs it"}
  - {first_install: true, policy: notify, override: none, flags: [],                       local: same, accept: false, mode: interactive, outcome: installed}
  - {first_install: true, policy: notify, override: none, flags: [runs_at_load],           local: same, accept: false, mode: interactive, outcome: held:flagged}
  - {first_install: true, policy: auto,   override: none, flags: [runnable_file],          local: same, accept: false, mode: interactive, outcome: held:flagged}
  - {first_install: true, policy: auto,   override: none, flags: [runnable_file],          local: same, accept: true,  mode: unattended,  outcome: held:flagged, note: "accept_flagged_updates never applies to a first install (contract §5.3, 1803115)"}

# accept_held_update (contract §3, 6532eba): its flags[] is compared with the held flags as a set of kinds (order and repeats
# ignored); a missing or extra kind is conflict and changes nothing. Here the held update is prc v2 -> v3 in an MCP setup,
# held: flagged with [runnable_file] (histories.prc), and each case sends the held result's confirm.
accept_cases:
  held_flags: [runnable_file]
  cases:
    - {flags: [runnable_file], outcome: updated}
    - {flags: [runnable_file, runnable_file], outcome: updated, note: "repeats ignored"}
    - {flags: [], outcome: conflict, installed_unchanged: true}
    - {flags: [runnable_file, runs_at_load], outcome: conflict, installed_unchanged: true, note: "an extra kind"}
    - {flags: [instructions_changed], outcome: conflict, installed_unchanged: true}
  two_kinds:
    held_flags: [capability_frontmatter, instructions_changed]
    note: "a first install of gate.g1 (histories.gate: null -> gate.g1), held: flagged"
    cases:
      - {flags: [instructions_changed, capability_frontmatter], outcome: installed, note: "order ignored"}
      - {flags: [capability_frontmatter], outcome: conflict, no_new_skill_dirs: true}
