# Held-update table (the QA plan's oracle "Held updates"; traceability `policy.table`), bound to
# the contract §5.3 (the owner's decision). Hand-written: for each case, the one outcome
# `update_installed_skills` must give. A unit test runs every row against the update hold; an interface test
# runs a sample through the CLI with a real lock file (SKILLS_SYNC_ON_START=0 so the test controls sync).
#
# policy: the global default; override: per skill (none = inherit). The effective policy is the override when set.
# flags: the risk_flags the newest version raises against the installed one (contract §5.3):
#   from the diff: runnable_file, runs_at_load, capability_frontmatter, instructions_changed, non_markdown, new_publisher
#   (which change raises which flag: histories.yaml `gate`);
#   from the rules reviewer, run by the installer on the fetched version: prompt_injection, context_cost.
#   [] = a markdown-only change with no reviewer findings. `newer: false` = no newer version.
# local: same | changed_here. Phase 1 (the owner's decision; contract §5.4): nothing checks for local changes and an update replaces the installed copy, so
#   `outcome` ignores `local`. `if_protected` is the outcome if the owner later picks protection.
# accept: the setup option accept_flagged_updates (default false).
# mode: interactive | unattended (unattended holds are reported at the next session).
# outcome: updated | unchanged | installed | held:other_catalog | held:pin | held:notify | held:flagged
# Precedence (contract §5.3, c5b03b4): other_catalog, then pin, then notify, then the risk-flag hold.
# first_install: true = an install from nothing (contract §5.3): it follows the auto rows whatever the policy, so no flags
#   installs and any flag is held:flagged, then accept_held_update with its confirm installs it.
# install_over: true = install_shared_skill asks for another version of a skill installed there (the owner's decision;
#   contract §3, §5.3, d6e6a87, 123377d, 241c647). It follows that skill's rows, like an update: pin and notify hold it
#   (the held result carries `from`, the installed version), auto goes through the risk-flag hold, and an unflagged one is
#   `installed`, the lock's version moving and its accepted flags unchanged. `older: true` = the version asked for is older
#   than the installed one (a downgrade counts as another version). `newer: false` = the same version: `unchanged`
#   {version}, nothing written, when the installed copy is intact (its fingerprint matches the lock's); `intact: false` =
#   files of the installed copy were changed or removed, so that version is written again (`installed`) whatever the
#   policy. accept_flagged_updates never applies to an install, a first one or one over an installed skill (241c647).
# catalog: other = the lock entry came from another catalog than the one in use (a skill of the same name from somewhere
#   else; c5b03b4): held:other_catalog {was, now}, first in the order, never applied silently, even with
#   accept_flagged_updates on (the option covers flags, not where a skill comes from).
# pending: "<what it waits for>" = a row the product can't run yet; tests skip it and the pending list names it.

cases:
  - {policy: auto,   override: none,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: updated}
  - {policy: auto,   override: none,   flags: [],                       local: same,         accept: false, mode: unattended,  outcome: updated}
  - {policy: auto,   override: none,   flags: [non_markdown],           local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [non_markdown],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [runnable_file],          local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [capability_frontmatter], local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [new_publisher],          local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [prompt_injection],       local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [context_cost],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [],                       local: changed_here, accept: false, mode: interactive, outcome: updated, if_protected: held:changed_here}
  - {policy: auto,   override: none,   flags: [], newer: false,         local: changed_here, accept: false, mode: interactive, outcome: unchanged, if_protected: held:changed_here}
  - {policy: auto,   override: pin,    flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:pin}
  - {policy: auto,   override: notify, flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:notify}
  - {policy: auto,   override: notify, flags: [],                       local: same,         accept: false, mode: unattended,  outcome: held:notify}
  - {policy: notify, override: none,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:notify}
  - {policy: notify, override: auto,   flags: [],                       local: same,         accept: false, mode: unattended,  outcome: updated}
  - {policy: notify, override: auto,   flags: [non_markdown],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: pin,    override: none,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: held:pin}
  - {policy: pin,    override: auto,   flags: [],                       local: same,         accept: false, mode: interactive, outcome: updated}
  - {policy: auto,   override: none,   flags: [], newer: false,         local: same,         accept: false, mode: interactive, outcome: unchanged}
  - {policy: auto,   override: none,   flags: [non_markdown],           local: same,         accept: true,  mode: unattended,  outcome: updated, note: "The lock records each update the option let through"}
  - {policy: auto,   override: none,   flags: [prompt_injection],       local: same,         accept: true,  mode: unattended,  outcome: updated, note: "accept_flagged_updates covers every flag kind; the lock records it"}
  - {policy: auto,   override: none,   flags: [],                       local: changed_here, accept: true,  mode: unattended,  outcome: updated, if_protected: held:changed_here}
  - {policy: pin,    override: none,   flags: [],                       local: changed_here, accept: false, mode: interactive, outcome: held:pin, if_protected: held:changed_here}
  - {policy: notify, override: none,   flags: [runnable_file],          local: changed_here, accept: false, mode: interactive, outcome: held:notify, if_protected: held:changed_here}
  - {policy: auto,   override: pin,    flags: [non_markdown],           local: same,         accept: true,  mode: unattended,  outcome: held:pin}
  # The new diff flags (contract §5.3, f4a1df7): each holds an auto update like any other flag.
  - {policy: auto,   override: none,   flags: [runs_at_load],           local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [runs_at_load],           local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [instructions_changed],   local: same,         accept: false, mode: interactive, outcome: held:flagged}
  - {policy: auto,   override: none,   flags: [instructions_changed],   local: same,         accept: false, mode: unattended,  outcome: held:flagged}
  # A first install is held like an update whatever the policy (it follows the auto rows).
  - {first_install: true, policy: pin,    override: none, flags: [],                       local: same, accept: false, mode: interactive, outcome: installed}
  - {first_install: true, policy: pin,    override: none, flags: [capability_frontmatter], local: same, accept: false, mode: interactive, outcome: held:flagged, note: "then accept_held_update with its confirm installs it"}
  - {first_install: true, policy: notify, override: none, flags: [],                       local: same, accept: false, mode: interactive, outcome: installed}
  - {first_install: true, policy: notify, override: none, flags: [runs_at_load],           local: same, accept: false, mode: interactive, outcome: held:flagged}
  - {first_install: true, policy: auto,   override: none, flags: [runnable_file],          local: same, accept: false, mode: interactive, outcome: held:flagged}
  - {first_install: true, policy: auto,   override: none, flags: [runnable_file],          local: same, accept: true,  mode: unattended,  outcome: held:flagged, note: "accept_flagged_updates never applies to a first install (contract §5.3, 1803115)"}
  # An install over an installed skill follows that skill's rows (the owner's decision; d6e6a87, 123377d, 241c647).
  - {install_over: true, policy: pin,    override: none,   flags: [],                       local: same, accept: false, mode: interactive, outcome: held:pin, note: "the held result carries target, version and from; accepting keeps the pin, at the new version"}
  - {install_over: true, policy: pin,    override: none,   flags: [], older: true,          local: same, accept: false, mode: interactive, outcome: held:pin, note: "an older version is another version too"}
  - {install_over: true, policy: auto,   override: pin,    flags: [runnable_file],          local: same, accept: false, mode: interactive, outcome: held:pin, note: "pin before the flags; the hold lists them and accept names them"}
  - {install_over: true, policy: notify, override: none,   flags: [],                       local: same, accept: false, mode: interactive, outcome: held:notify}
  - {install_over: true, policy: auto,   override: notify, flags: [runs_at_load],           local: same, accept: false, mode: interactive, outcome: held:notify, note: "shown with its flags", pending: "the installer's flag check raising runs_at_load"}
  - {install_over: true, policy: auto,   override: none,   flags: [],                       local: same, accept: false, mode: interactive, outcome: installed, note: "the lock's version moves; its accepted flags are unchanged"}
  - {install_over: true, policy: auto,   override: none,   flags: [], older: true,          local: same, accept: false, mode: interactive, outcome: installed, note: "an unflagged downgrade installs, diffed from the installed version"}
  - {install_over: true, policy: auto,   override: none,   flags: [non_markdown],           local: same, accept: false, mode: interactive, outcome: held:flagged}
  - {install_over: true, policy: pin,    override: auto,   flags: [capability_frontmatter], local: same, accept: false, mode: interactive, outcome: held:flagged}
  - {install_over: true, policy: auto,   override: none,   flags: [non_markdown],           local: same, accept: true,  mode: unattended,  outcome: held:flagged, note: "accept_flagged_updates never applies to an install over an installed skill either (241c647)"}
  - {install_over: true, policy: auto,   override: none,   flags: [prompt_injection],       local: same, accept: true,  mode: unattended,  outcome: held:flagged, note: "every flag kind, the reviewer's too", pending: "the rules reviewer in the installer's flag check (prompt_injection)"}
  - {install_over: true, policy: pin,    override: none,   flags: [], newer: false,         local: same, accept: false, mode: interactive, outcome: unchanged, note: "the same version: unchanged {version}, nothing written, the lock byte-identical"}
  - {install_over: true, policy: auto,   override: none,   flags: [], newer: false,         local: same, accept: false, mode: interactive, outcome: unchanged}
  - {install_over: true, policy: pin,    override: none,   flags: [], newer: false, intact: false, local: changed_here, accept: false, mode: interactive, outcome: installed, note: "the same version written again over a changed or incomplete copy, whatever the policy (123377d)"}
  # A lock entry from another catalog (c5b03b4): held:other_catalog {was, now}, first in the order, never applied silently.
  - {catalog: other, policy: auto,   override: none,   flags: [],                       local: same, accept: false, mode: interactive, outcome: held:other_catalog}
  - {catalog: other, policy: auto,   override: none,   flags: [],                       local: same, accept: false, mode: unattended,  outcome: held:other_catalog}
  - {catalog: other, policy: pin,    override: none,   flags: [],                       local: same, accept: false, mode: interactive, outcome: held:other_catalog, note: "before pin"}
  - {catalog: other, policy: auto,   override: notify, flags: [runnable_file],          local: same, accept: false, mode: interactive, outcome: held:other_catalog, note: "before notify and the flags; the hold lists the flags"}
  - {catalog: other, policy: auto,   override: none,   flags: [non_markdown],           local: same, accept: true,  mode: unattended,  outcome: held:other_catalog, note: "accept_flagged_updates covers flags, not where a skill comes from"}
  - {catalog: other, install_over: true, policy: auto, override: none, flags: [],       local: same, accept: false, mode: interactive, outcome: held:other_catalog, note: "an install over it too"}

# Permissive modes (contract §5.3; detection pinned at ff9c881 and f1b7200; e22d154 replaced the blanket hold): while one is
# detected, added or changed lines get command_instruction (histories.gate pairs with `permissive`).
# permissive_settings: the assistant's settings files -> the mode the installer reads (null = not permissive). Files are
# read as Claude Code reads them: managed, then the project's .claude/settings.local.json and .claude/settings.json, then
# ~/.claude/settings.json; a single value comes from the highest file that sets it; permissions.allow lists merge.
# A broad rule (f1b7200): Bash, Bash(*), PowerShell(*), or a rule with a * whose first word holds the * or, less a trailing
# colon, is on broad_bash_runners (interpreters and wrappers).
# defaultMode auto and bypassPermissions count only from user or managed settings. Tests write these files under a fake
# home, project and managed root, never the real ones.
permissive_settings:
  - {files: {"user": {"permissions": {"defaultMode": "auto"}}}, mode: auto, note: "auto mode in the user's settings"}
  - {files: {"managed": {"permissions": {"defaultMode": "bypassPermissions"}}}, mode: bypass, note: "bypass in managed settings"}
  - {files: {"user": {"permissions": {"defaultMode": "bypassPermissions"}}}, mode: bypass}
  - {files: {"project": {"permissions": {"defaultMode": "auto"}}}, mode: null, note: "Claude Code ignores auto in a project's settings"}
  - {files: {"project_local": {"permissions": {"defaultMode": "bypassPermissions"}}}, mode: null, note: "and bypass in settings.local"}
  - {files: {"user": {"permissions": {"defaultMode": "acceptEdits"}}}, mode: null, note: "accept-edits is not permissive"}
  - {files: {"user": {"sandbox": {"enabled": true}}}, mode: sandbox_auto_allow, note: "autoAllowBashIfSandboxed defaults to true"}
  - {files: {"user": {"sandbox": {"enabled": true, "autoAllowBashIfSandboxed": false}}}, mode: null, note: "auto-allow turned off"}
  - {files: {"project": {"sandbox": {"enabled": true}}}, mode: sandbox_auto_allow, note: "a project's sandbox setting counts (only auto and bypass are ignored there)"}
  - {files: {"user": {"sandbox": {"enabled": true}}, "project": {"sandbox": {"enabled": false}}}, mode: null, note: "the project's value is higher than the user's"}
  - {files: {"project": {"sandbox": {"enabled": true}}, "project_local": {"sandbox": {"enabled": false}}}, mode: null, note: "settings.local is higher than the project's settings"}
  - {files: {"user": {"permissions": {"allow": ["Bash"]}}}, mode: broad_bash_rule}
  - {files: {"user": {"permissions": {"allow": ["Bash(*)"]}}}, mode: broad_bash_rule}
  - {files: {"user": {"permissions": {"allow": ["PowerShell(*)"]}}}, mode: broad_bash_rule}
  - {files: {"project": {"permissions": {"allow": ["Bash(python3 *)"]}}}, mode: broad_bash_rule, note: "allow lists merge across every file, the project's included"}
  - {files: {"user": {"permissions": {"allow": ["Bash(python3:*)"]}}}, mode: broad_bash_rule, note: "':*' equals a trailing ' *'"}
  - {files: {"user": {"permissions": {"allow": ["Bash(node*)"]}}}, mode: broad_bash_rule}
  - {files: {"user": {"permissions": {"allow": ["Bash(uv run *)"]}}}, mode: broad_bash_rule}
  - {files: {"user": {"permissions": {"allow": ["Bash(git *)"]}}}, mode: null, note: "a narrow rule"}
  - {files: {"user": {"permissions": {"allow": ["Bash(sh -c *)"]}}}, mode: broad_bash_rule, note: "an interpreter with a flag before the *: its first word counts (f1b7200)"}
  - {files: {"user": {"permissions": {"allow": ["Bash(python3 -c *)"]}}}, mode: broad_bash_rule}
  - {files: {"user": {"permissions": {"allow": ["Bash(uv run python *)"]}}}, mode: broad_bash_rule}
  - {files: {"user": {"permissions": {"allow": ["Bash(env *)"]}}}, mode: broad_bash_rule, note: "a wrapper that runs any command"}
  - {files: {"user": {"permissions": {"allow": ["Bash(sudo:*)"]}}}, mode: broad_bash_rule, note: "a wrapper, ':*' form"}
  - {files: {"user": {"permissions": {"allow": ["Bash(* --help *)"]}}}, mode: broad_bash_rule, note: "the first word holds the *: any program"}
  - {files: {"user": {"permissions": {"allow": ["PowerShell(powershell -Command *)"]}}}, mode: broad_bash_rule}
  - {files: {"user": {"permissions": {"allow": ["Bash(gitx *)"]}}}, mode: null, note: "not a runner, and no * in the first word"}
  - {files: {"user": {"permissions": {"allow": ["Bash(npm run *)"]}}}, mode: null, note: "npm isn't an interpreter on the list"}
  - {files: {"user": {"permissions": {"allow": ["Bash(python3 scripts/check.py)"]}}}, mode: null, note: "no wildcard: one exact command"}
  - {files: {"user": {"permissions": {"allow": ["Read(**)", "Bash(git *)"]}}, "project": {"permissions": {"allow": ["Bash(ls *)"]}}}, mode: null, note: "merged, still narrow"}
  - {files: {"user": {"permissions": {"defaultMode": "auto", "allow": ["Bash(*)"]}}}, mode: auto, note: "several: the first in the order auto, bypass, sandbox_auto_allow, broad_bash_rule"}
  - {files: {"user": {"sandbox": {"enabled": true}, "permissions": {"allow": ["Bash(python3 *)"]}}}, mode: sandbox_auto_allow}
  - {files: {"project": {"permissions": {"defaultMode": "auto", "allow": ["Bash(*)"]}}}, mode: broad_bash_rule, note: "the project's auto is ignored; its broad rule counts"}
  - {files: {}, mode: null, note: "no settings at all"}

# command_instruction in the policy table (contract e22d154): it's a flag like any other. With auto-updates on,
# every surface asks only when an update is flagged; there is no blanket hold in a permissive mode. Order: pin, notify,
# then the flags. A pinned skill and a version in its cooldown ask nothing and give no session-start notice.
command_instruction_cases:
  - {policy: auto,   override: none, flags: [command_instruction], accept: false, mode: interactive, outcome: "held:flagged"}
  - {policy: auto,   override: none, flags: [command_instruction], accept: false, mode: unattended,  outcome: "held:flagged", notice: true}
  - {policy: auto,   override: none, flags: [command_instruction], accept: true,  mode: unattended,  outcome: updated, note: "accept_flagged_updates lets it through like any flag; the lock records it"}
  - {policy: auto,   override: none, flags: [],                    accept: false, mode: unattended,  outcome: updated, notice: false, note: "nothing flagged in a permissive mode: applied silently, no question on any surface"}
  - {policy: auto,   override: pin,  flags: [command_instruction], accept: false, mode: unattended,  outcome: "held:pin", notice: false, note: "a pinned skill asks nothing and gives no notice"}
  - {policy: notify, override: none, flags: [command_instruction], accept: false, mode: interactive, outcome: "held:notify"}
  - {first_install: true, policy: auto, override: none, flags: [command_instruction], accept: true, mode: interactive, outcome: "held:flagged", note: "a first install is held when flagged; accept_flagged_updates never applies to it"}

# not_installed (contract §3, §9, 0038bde): naming a skill that isn't installed on this machine is not_installed {name}, and
# nothing changes. For update_installed_skills' names, the first such name in the order given, checked before any fetch.
# Installed here: release-note-draft and pr-review-checklist.
not_installed_cases:
  - {call: set_skill_update_policy, args: {policy: pin, name: deploy-helper}, expect: {error: not_installed, name: deploy-helper}, config_unchanged: true}
  - {call: update_installed_skills, args: {names: [release-note-draft, deploy-helper, sql-formatter]}, expect: {error: not_installed, name: deploy-helper}, installed_unchanged: true, no_fetch: true, note: "the first not-installed name in the order given, before any fetch: release-note-draft isn't updated either"}
  - {call: update_installed_skills, args: {names: [pr-review-checklist]}, expect: {error: null}, note: "an installed name works as usual"}

# accept_held_update (contract §3, 6532eba): its flags[] is compared with the held flags as a set of kinds (order and repeats
# ignored); a missing or extra kind is conflict and changes nothing. Here the held update is prc v2 -> v3 in an MCP setup,
# held: flagged with [runnable_file] (histories.prc), and each case sends the held result's confirm.
accept_cases:
  held_flags: [runnable_file]
  cases:
    - {flags: [runnable_file], outcome: updated}
    - {flags: [runnable_file, runnable_file], outcome: updated, note: "repeats ignored"}
    - {flags: [], outcome: conflict, installed_unchanged: true}
    - {flags: [runnable_file, runs_at_load], outcome: conflict, installed_unchanged: true, note: "an extra kind"}
    - {flags: [instructions_changed], outcome: conflict, installed_unchanged: true}
  no_flags:
    held_flags: []
    note: "a hold with no risk flags (notify, or a cooldown) takes flags: [] (ff9c881)"
    cases:
      - {flags: [], outcome: updated}
      - {flags: [runnable_file], outcome: conflict, installed_unchanged: true}
  two_kinds:
    held_flags: [capability_frontmatter, instructions_changed]
    note: "a first install of gate.g1 (histories.gate: null -> gate.g1), held: flagged"
    cases:
      - {flags: [instructions_changed, capability_frontmatter], outcome: installed, note: "order ignored"}
      - {flags: [capability_frontmatter], outcome: conflict, no_new_skill_dirs: true}
  target_version:
    held: {name: runner, target: user, version: 2, flags: [runnable_file]}
    note: >-
      accept_held_update takes name, target, version and confirm, all four from the held result, and flags (c5b03b4). target
      and version are compared exactly, as the confirm is (it's tied to the name, the target and the version's fingerprint):
      another target, an older or a missing version is conflict, changing nothing. A missing input is invalid_request
      {field, why: required}. Each case starts from the same hold (runner v1 installed in the user target, v2 adds a script).
    cases:
      - {send: {target: user, version: 2}, outcome: updated}
      - {send: {target: project, version: 2}, outcome: conflict, installed_unchanged: true, note: "another target"}
      - {send: {target: user, version: 1}, outcome: conflict, installed_unchanged: true, note: "an older version"}
      - {send: {target: user, version: 3}, outcome: conflict, installed_unchanged: true, note: "a version that doesn't exist"}
      - {send: {version: 2}, outcome: {error: invalid_request, field: target, why: required}, installed_unchanged: true}
      - {send: {target: user}, outcome: {error: invalid_request, field: version, why: required}, installed_unchanged: true}
  keeps_policy:
    note: >-
      Accepting a held pin or notify, an install's or an update's (both carry a confirm), takes that version and keeps the
      policy: a pinned skill stays pinned, at the new version (123377d). v1 installed, v2 in the catalog.
    cases:
      - {hold: {from: install, reason: pin}, flags: [], lock_version_after: 2, policy_after: pin}
      - {hold: {from: update, reason: pin}, flags: [], lock_version_after: 2, policy_after: pin}
      - {hold: {from: install, reason: notify, risk_flags: [runs_at_load]}, flags: [runs_at_load], lock_version_after: 2, policy_after: notify, pending: "the installer's flag check raising runs_at_load"}
      - {hold: {from: install, reason: pin}, flags: [runnable_file], outcome: conflict, installed_unchanged: true, note: "a kind the hold didn't list"}
  other_catalog:
    note: "accepting a held other_catalog records the catalog in use now in the lock entry (c5b03b4); the policy is kept"
    cases:
      - {flags: [], lock_version_after: 2, lock_catalog_after: now, policy_after: unchanged}

# A damaged lock or config file (contract §4.5, §9; 4f3b878): invalid_local_file {file, why, path}. Each case starts from a
# real install of prc.v1 (user target, so lock.json holds one entry written by the installer, keyed by its path) and a
# config.json holding {"update_policy": "auto"}, then `damage` rewrites one of them. `entry.<field>` changes that field of
# the one lock entry and nothing else. Then every command in `commands` refuses with the expected error, and afterwards:
# the damaged file is byte-identical (never repaired or replaced), no skill folder changed, no other file in $SKILLS_HOME
# changed, and no output (sentence, JSON, log line) contains QA-SENTINEL-$RUN_ID, planted inside each damaged file where
# JSON allows it. path = the file's full path. teardown still runs (exit 0); the session-start hook exits 0 and prints
# exactly one line, fixed words naming the file. `ok_cases` are not damage: the commands work as usual.
local_files:
  commands: [install_shared_skill, update_installed_skills, accept_held_update, list_installed_skills, set_skill_update_policy, setup]
  expect_every_command: {error: invalid_local_file, same_file: true, path: "$SKILLS_HOME/<file>", file_byte_identical: true, skills_unchanged: true, output_never_contains: "QA-SENTINEL-$RUN_ID"}
  teardown: {exit: 0}
  session_start_hook: {exit: 0, stdout_lines: 1, names_file: true, output_never_contains: "QA-SENTINEL-$RUN_ID"}
  cases:
    - {id: lock-not-json, file: lock.json, damage: {bytes: "{\"skills\": QA-SENTINEL-$RUN_ID"}, why: not_json}
    - {id: lock-empty, file: lock.json, damage: {bytes: ""}, why: not_json, note: "an empty file is not JSON; a missing file is fine (ok_cases)"}
    - {id: lock-array, file: lock.json, damage: {bytes: "[\"QA-SENTINEL-$RUN_ID\"]"}, why: wrong_shape}
    - {id: lock-skills-array, file: lock.json, damage: {bytes: "{\"skills\": [\"QA-SENTINEL-$RUN_ID\"]}"}, why: wrong_shape}
    - {id: lock-version-text, file: lock.json, damage: {entry.version: "1"}, why: wrong_shape, note: "a field of the wrong type in a lock entry"}
