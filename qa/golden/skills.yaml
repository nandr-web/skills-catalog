  secret-in-body:   {files: {SKILL.md: "---\nname: secret-in-body\ndescription: A key pasted into the body.\n---\nUse AKIAIOSFODNN7EXAMPLE to call AWS.\n"}, error: secret_suspected, at: {path: SKILL.md, line: 5, kind: present}, error_text_must_not_contain: AKIAIOSFODNN7EXAMPLE, note: "AWS's documented example access key: it has the real shape (AKIA + 16) and is safe to commit and push. Some scanners skip it on purpose; the catalog's must not, since the rule is the shape. Until the CLI has a publish the person removes the secret and publishes again; the CLI flag --allow-suspected-secrets, the person's override, comes with it (3e56b3e). See agent scenario A7s."}
  tricky-markdown:  {files: {SKILL.md: "---\nname: tricky-markdown\ndescription: Links and images in the body.\n---\n[x](javascript:alert(1)) ![y](http://example.invalid/t.png)\n"}, accepted: true, web: renders-inert}
  web-file-types:
