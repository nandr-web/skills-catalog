  path-case-clash:  {raw_files: [{path: SKILL.md, text: "---\nname: path-case-clash\ndescription: Two paths equal ignoring case.\n---\nBody.\n"}, {path: Notes.md, text: "a\n"}, {path: notes.md, text: "b\n"}], error: invalid_path}
  unicode-form-clash: {raw_files: [{path: SKILL.md, text: "---\nname: unicode-form-clash\ndescription: NFC and NFD forms of one name.\n---\nBody.\n"}, {path: "café.md", text: "nfc\n"}, {path: "café.md", text: "nfd\n"}], error: invalid_path}
  ignore-list:
    note: "publish_skill_to_catalog skips and reports the ignore list (.git, .env*, *.pem, id_*, .DS_Store). An ignored folder is one entry with a trailing slash and is never walked, so .git/config is not listed; the list is sorted by path in code-point order (D < e < g); 5 entries, so no skipped_more (a5fd3f2, pinned 309ecca)."
    files:
      SKILL.md: "---\nname: ignore-list\ndescription: Folder holds files that must not be published.\n---\nBody.\n"
      .env: "QA_SENTINEL=QA-SENTINEL-$RUN_ID\n"
      .git/config: "[core]\n"
      id_fake: "QA-SENTINEL-$RUN_ID\n"
      key.pem: "QA-SENTINEL-$RUN_ID\n"
      .DS_Store: "x"
    expect: {published_paths: [SKILL.md], skipped_reported: [.DS_Store, .env, .git/, id_fake, key.pem], skipped_more: absent, sentinel_must_not_leak: true}
  ignored-folders:
    note: "309ecca: every ignore-list name that is a folder, at any depth, is one entry and is never walked or read. Inside them: a link, a fifo and a hard link to the canary's secret, each of which would be not_regular_file if read (see symlink-in, special-file, hardlink), so the publish going ahead proves they weren't walked. .env is a Python venv folder here, .env.d a config folder. Order: .env.d/ before .env/ because '.' (U+002E) < '/' (U+002F). sub/ holds only its .git, so nothing under sub/ is published"
    files:
      SKILL.md: "---\nname: ignored-folders\ndescription: Ignored folders at several depths.\n---\nSee notes.md.\n"
      notes.md: "Notes.\n"
      .git/config: "[core]\n"
