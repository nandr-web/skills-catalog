# Skill fixtures (the QA plan, golden sets: "Skills"), bound to the contract (§4 data, §9 error codes).
# PENDING: a row with `pending: "<what it waits for>"` states behaviour the product doesn't have yet. Tests that read
# the goldens run it as skipped (never as passed), and a meta test lists every pending row, so none is forgotten. The
# commit that builds the behaviour removes the marker.
# The harness materializes each one into the run's sandbox; nothing is shared between runs.
# Expected verdicts and errors are hand-written oracles.
#
# Content forms under `files` (path → content): a plain string; {base64: …}; {crlf: true, text: …};
# {bom: true, text: …}; {size: <bytes or limit expression>, fill: "x"}; {text: …, pad_to: <bytes>, fill: "x"} (the text,
# then fill up to exactly that size); {mode: "0755", text: …};
# {symlink: <target, absolute or relative to the link>}; {hardlink: <absolute target>}; {fifo: true}.
# `raw_files` = a raw publish_version request (a JSON list of {path, mode, content}), for shapes a
# folder can't hold (duplicates, "..", absolute paths, NFC/NFD pairs, case clashes on this Mac).
# Limit expressions read the catalog's configured limits at test time (defaults: 100 files,
# 1 MB per file, 5 MB per skill). $RUN = the sandbox root; $RUN/outside/ is the canary folder,
# created and asserted at setup, holding the sentinel QA-SENTINEL-$RUN_ID.
#
# FILE TYPES (contract §2, read_shared_skill): with `include: files`, every file of every `valid` fixture has
# `type: text`, except binary-file's logo.png (`binary`). By content, not name: file-at-limit's big.bin is all
# 'x', so it's text; keep.txt (empty) is text; crlf-and-bom's files are text. With `include: contents`, every
# text file has `content`, SKILL.md included, and encoding `content` as UTF-8 gives back the stored bytes
# exactly (BOM and CRLF kept); logo.png has no `content`.
#
# RULES REVIEW (contract draft 3 §10, Phase 1's built-in rules reviewer): every `valid` fixture must get
# a review with NO findings (the owner: reviewers are "completely fine with approving without comments
# when something's good"), unless it lists `review_expect`. Every finding must be grounded: {kind, path,
# line, evidence}, where evidence is a substring of that line. The `flagged` group is accepted by
# publish and must be flagged.
#
# SAFETY RULE FOR THIS FILE: never plant destructive content. An assistant under test may read and
# act on these; hostile targets always point into $RUN/outside/, never at the real home or /tmp.

valid:
  minimal:
    files:
      SKILL.md: "---\nname: minimal\ndescription: The smallest valid skill.\n---\nSay hello.\n"
  release-note-draft:
    note: "The PRD's example: a manifest plus a template file. Its versions are in histories.yaml (h1)."
    files:
      SKILL.md: "---\nname: release-note-draft\ndescription: Drafts release notes from merged pull requests using the team template. Use when preparing a release.\n---\n# Release note draft\n\n1. List the merged PRs since the last tag.\n2. Group them by type.\n3. Fill templates/release.md.\n"
      templates/release.md: "# Release {{version}}\n\n## Features\n\n## Fixes\n"
  pr-review-checklist:
    note: "v1. Its v2 is in histories.yaml (prc)."
    files:
      SKILL.md: "---\nname: pr-review-checklist\ndescription: A checklist for reviewing pull requests (tests, naming, security, docs). Use when asked to review a PR.\n---\nWork through checklist.md item by item.\n"
      checklist.md: "- [ ] Tests cover the change\n- [ ] Names say what things are\n- [ ] No secrets\n"
  nested:
    files:
      SKILL.md: "---\nname: nested\ndescription: Supporting files in nested folders.\n---\nSee a/b/c/deep.md.\n"
      a/b/c/deep.md: "deep\n"
      a/sibling.md: "sibling\n"
  binary-file:
    note: "Round trip through install_shared_skill and fetch_version only; read_shared_skill never inlines binaries."
    files:
      SKILL.md: "---\nname: binary-file\ndescription: Carries a small PNG.\n---\nUse logo.png.\n"
      logo.png: {base64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="}
  executable-script:
    note: "Mode 0755 is part of the fingerprint and must survive the round trip."
    files:
      SKILL.md: "---\nname: executable-script\ndescription: Runs a helper script.\n---\nRun scripts/check.sh.\n"
      scripts/check.sh: {mode: "0755", text: "#!/bin/sh\necho ok\n"}
    review_expect: [{kind: runnable_file, path: scripts/check.sh}]
  unicode-path:
    note: "Stored NFC; the oracle compares NFC paths."
    files:
      SKILL.md: "---\nname: unicode-path\ndescription: A file name outside ASCII.\n---\nSee notas/café.md.\n"
      notas/café.md: "olá\n"
  empty-file:
    files:
      SKILL.md: "---\nname: empty-file\ndescription: Carries an empty file.\n---\nkeep.txt is empty on purpose.\n"
      keep.txt: ""
  crlf-and-bom:
    note: "Bytes, not text: CRLF and a BOM come back exactly."
    files:
      SKILL.md: {crlf: true, text: "---\nname: crlf-and-bom\ndescription: Windows line endings.\n---\nBody.\n"}
      notes.md: {bom: true, text: "with a BOM\n"}
  file-at-limit:
    files:
      SKILL.md: "---\nname: file-at-limit\ndescription: One file exactly at the per-file limit.\n---\nBig.\n"
      big.bin: {size: "limit.file_bytes", fill: "x"}
  files-at-limit:
    generate: "SKILL.md plus (limit.files - 1) one-line files: exactly limit.files files"
  skill-at-limit:
    generate: "SKILL.md plus files each under limit.file_bytes, summing exactly to limit.skill_bytes"
  name-64:
    files:
      SKILL.md: "---\nname: a-skill-name-that-is-exactly-sixty-four-characters-long-abcdefgh\ndescription: Name at exactly 64 characters.\n---\nBody.\n"
  description-1024:
    generate: "SKILL.md whose description is exactly 1024 characters, no < or >"
  # TAGS (contract §4.1): metadata.tags, one comma-separated string; spaces around commas trimmed; duplicates removed,
  # order kept; ≤10 tags of 1-32 [a-z0-9-]. tags_expect = the skill's tags as read and on its card. Search filter:
  # filters.tags [docs] → exactly tagged, tags-deduped, tags-at-limit; [docs, release] (all of them) → exactly tagged,
  # tags-deduped; a top-level `tags:` list is an ordinary key, never a tag.
  # Search filter limits (contract §9, 6532eba): more than 10 tags, or a tag over 32 characters, is invalid_request, never
  # clamped: search_filters below.
  tagged:
    files:
      SKILL.md: "---\nname: tagged\ndescription: Carries two tags.\nmetadata:\n  tags: release, docs\n---\nBody.\n"
    tags_expect: [release, docs]
  tags-deduped:
    files:
      SKILL.md: "---\nname: tags-deduped\ndescription: Repeats a tag.\nmetadata:\n  tags: docs,release,docs\n---\nBody.\n"
    tags_expect: [docs, release]
  tags-at-limit:
    files:
      SKILL.md: "---\nname: tags-at-limit\ndescription: Ten tags, one of 32 characters.\nmetadata:\n  tags: docs, t1, t2, t3, t4, t5, t6, t7, t8, abcdefghij-abcdefghij-abcdefghij\n---\nBody.\n"
    tags_expect: [docs, t1, t2, t3, t4, t5, t6, t7, t8, abcdefghij-abcdefghij-abcdefghij]
  tags-top-level-list:
    files:
      SKILL.md: "---\nname: tags-top-level-list\ndescription: A top-level tags list, which is not where tags go.\ntags: [docs, release]\n---\nBody.\n"
    tags_expect: []
    note: "kept as published (frontmatter shows it), but not tags: the docs filter never returns it"
  near-reserved:
    note: "a near name of a reserved one is allowed (contract §4.1)"
    files:
      SKILL.md: "---\nname: code-review-2\ndescription: Not the bundled code-review.\n---\nBody.\n"
  near-claude-folders:
    note: "only the exact folder names .claude / .claude-plugin (case-folded) are refused; these are allowed (contract §4.2)"
    files:
      SKILL.md: "---\nname: near-claude-folders\ndescription: Folders that only look like an assistant's.\n---\nBody.\n"
      .claude-x/notes.md: "a\n"
      claude/notes.md: "b\n"

