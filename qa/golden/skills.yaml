hostile:
  dotdot-path:      {raw_files: [{path: SKILL.md, text: "---\nname: dotdot-path\ndescription: Escapes.\n---\nBody.\n"}, {path: "../outside/escape.txt", text: "x"}], error: invalid_path, path: "../outside/escape.txt", why: dot_segment}
