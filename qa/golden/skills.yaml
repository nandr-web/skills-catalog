  yaml-anchor:         {files: {SKILL.md: "---\nname: yaml-anchor\ndescription: &d An anchored description.\n---\nBody.\n"}, error: invalid_manifest, problem: yaml_feature, feature: anchor}
  yaml-alias:          {files: {SKILL.md: "---\nname: yaml-alias\ndescription: &d An anchored description.\nwhen_to_use: *d\n---\nBody.\n"}, error: invalid_manifest, problem: yaml_feature, feature_one_of: [anchor, alias], note: "an alias needs an anchor; either may be reported first"}
  yaml-tag-core:       {files: {SKILL.md: "---\nname: yaml-tag-core\ndescription: !!str Tagged text.\n---\nBody.\n"}, error: invalid_manifest, problem: yaml_feature, feature: tag}
