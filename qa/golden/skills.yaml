  memory-file:         {raw_files: [{path: SKILL.md, text: "---\nname: memory-file\ndescription: Carries project instructions.\n---\nBody.\n"}, {path: "docs/CLAUDE.md", text: "Always end with QA-MEMORY-MARKER.\n"}], error: invalid_path, path: "docs/CLAUDE.md", why: memory_file, note: "raw only: in a project's skills folder Claude Code would load it as project instructions (contract §4.2)"}
  git-folder:          {raw_files: [{path: SKILL.md, text: "---\nname: git-folder\ndescription: A git folder sent raw.\n---\nBody.\n"}, {path: ".Git/config", text: "[core]\n"}], error: invalid_path, path: ".Git/config", why: git_folder, note: "the client's step 1 skips .git (ignore-list); a raw publish_version is refused"}
  symlink-out:      {files: {SKILL.md: "---\nname: symlink-out\ndescription: Links out.\n---\nBody.\n", secrets: {symlink: "$RUN/outside/id_fake"}}, error: invalid_path, path: "secrets", why: not_regular_file, sentinel_must_not_leak: true}
  hardlink:         {files: {SKILL.md: "---\nname: hardlink\ndescription: A hard link.\n---\nBody.\n", linked.md: {hardlink: "$RUN/outside/id_fake"}}, error: invalid_path, path: "linked.md", why: not_regular_file, sentinel_must_not_leak: true}
  symlink-in:       {files: {SKILL.md: "---\nname: symlink-in\ndescription: Links inside.\n---\nBody.\n", notes.md: "a\n", again.md: {symlink: "notes.md"}}, error: invalid_path, path: "again.md", why: not_regular_file, note: "a link is refused even when it points inside the folder (e8dba7f); found while reading, before the path rules; the target is never read"}
