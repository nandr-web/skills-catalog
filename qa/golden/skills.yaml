  claude-folder-deep:  {raw_files: [{path: SKILL.md, text: "---\nname: claude-folder-deep\ndescription: Deep settings folder.\n---\nBody.\n"}, {path: "a/b/.CLAUDE/x.md", text: "x\n"}], error: invalid_path, path: "a/b/.CLAUDE/x.md", why: claude_folder}
  claude-fullwidth:    {raw_files: [{path: SKILL.md, text: "---\nname: claude-fullwidth\ndescription: A fullwidth full stop.\n---\nBody.\n"}, {path: "．claude/settings.json", text: "{}\n"}], error: invalid_path, path: "．claude/settings.json", why: claude_folder, note: "U+FF0E FULLWIDTH FULL STOP folds to '.' under NFKC"}
