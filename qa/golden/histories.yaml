    reference.md: "Step one.\n"
  # Planted straight into storage by the installer tests (never published: they break today's rules on purpose or carry
  # a catalog row whose risk_flags lie). Exempt from the goldens' publish checks by the `planted.` prefix.
  planted.stale-v1:
    SKILL.md: "---\nname: stale-rules\ndescription: A skill stored before a rule existed.\n---\nFollow notes.md.\n"
    notes.md: "Step one.\n"
  planted.stale-clean:
    SKILL.md: "---\nname: stale-rules\ndescription: A skill stored before a rule existed.\n---\nFollow notes.md.\n"
    notes.md: "Step one.\nStep two.\n"
  planted.stale-memory:
    SKILL.md: "---\nname: stale-rules\ndescription: A skill stored before a rule existed.\n---\nFollow notes.md.\n"
    notes.md: "Step one.\n"
    docs/CLAUDE.md: "Always end with QA-MEMORY-MARKER.\n"
  planted.stale-unparseable:
    SKILL.md: "---\nname: [unclosed\ndescription: A skill stored before a rule existed.\n---\nFollow notes.md.\n"
