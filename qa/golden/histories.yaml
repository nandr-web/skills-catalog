      - {from: null, to: gate.g0-bang-line, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants nothing, row 2, first install: an injected command is a grant"}
      - {from: null, to: gate.g0-bang-block, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants nothing, row 3, first install"}
      - {from: null, to: gate.g0-fork, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: context, from: null, to: fork}, {kind: capability_frontmatter, path: SKILL.md, line: 5, field: agent, from: null, to: Explore}, {kind: instructions_changed, path: SKILL.md}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants nothing, row 4, first install"}
      - {from: null, to: gate.g0-ref, risk_flags: [], note: "matrix: grants nothing, row 5, first install: installs (the one designed gap: Claude Code's own prompts are the gate)"}

      # Contract e22d154, 5492cc2: `permissive` is the mode the installer detects (policy.yaml permissive_settings); none = the
      # default mode. Pairs without it are computed in the default mode.
      - {from: gate.g0, to: gate.g0-curl, permissive: auto, risk_flags: [{kind: command_instruction, path: SKILL.md, line: 6, instruction: fetch_and_run, mode: auto}], note: "in auto mode a fetch-and-run line is flagged, so the update is held: flagged"}
