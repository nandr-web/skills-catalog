    SKILL.md: "---\nname: older-rules\ndescription: Stored before the folder rule.\n---\nBody.\n"
    .claude/settings.json: "{}\n"
  planted.older-unparseable:
    SKILL.md: "---\nname: [unclosed\ndescription: Stored before the YAML rule.\n---\nBody.\n"
  planted.older-fixed:
    SKILL.md: "---\nname: older-rules\ndescription: Stored before the YAML rule, now fixed.\n---\nBody.\n"
  planted.older-fixed-grant:
    SKILL.md: "---\nname: older-rules\ndescription: Stored before the YAML rule, now fixed.\nallowed-tools: Bash(python3 *)\n---\nBody.\n"
histories:
  h1:
    name: release-note-draft
    steps:
      - {publish: h1.v1, message: "First version", expect: {created: true, version: 1, versions: [1], latest: 1}}
      - {publish: h1.v2, message: "Add a Breaking changes step", expect: {created: true, version: 2, versions: [1, 2], latest: 2, get_version: {1: h1.v1}}}
      - {publish: h1.v3, message: "Add an example of the output", expect: {created: true, version: 3, versions: [1, 2, 3], latest: 3}}
      - {publish: h1.v4, message: "Remove the example: it had gone stale. The template gets a Breaking changes section", expect: {created: true, version: 4, versions: [1, 2, 3, 4], latest: 4, read_version: {1: {version: 1, latest_version: 4}}}}
      - {publish: h1.malformed, expect: {error: invalid_manifest, fields: [description], versions: [1, 2, 3, 4], storage_unchanged: true}}
      - {publish: h1.v4, expect: {created: false, version: 4, versions: [1, 2, 3, 4]}}
      - {publish: h1.v1, expect: {created: true, version: 5, versions: [1, 2, 3, 4, 5], latest: 5, fingerprint_equals: h1.v1}, note: "a revert: identical to an older version, so a new version (contract §4.4)"}
      - {publish: h1.v2, dry_run: true, expect: {created: false, dry_run: true, storage_unchanged: true, diff_from_latest: {changed: [SKILL.md]}}}
    at: {h1@v4: "steps 1-4 applied", h1@v5: "steps 1-7 applied"}
    messages_expected: "list_shared_skill_versions returns each version's message exactly as published"
    diffs:
      - {from: 1, to: 2, files: [{path: SKILL.md, status: changed}], risk_flags: [], unified: diffs/h1-1-2.diff}
      - {from: 2, to: 3, files: [{path: examples/sample-output.md, status: added}], risk_flags: []}
      - {from: 3, to: 4, files: [{path: examples/sample-output.md, status: removed}, {path: templates/release.md, status: changed}], risk_flags: [], unified: diffs/h1-3-4.diff}

  prc:
    name: pr-review-checklist
    steps:
      - {publish: prc.v1, expect: {created: true, version: 1}}
      - {publish: prc.v2, expect: {created: true, version: 2}}
      - {publish: prc.v3, expect: {created: true, version: 3}}
    at: {prc@v2: "steps 1-2 applied", prc@v3: "steps 1-3 applied"}
    diffs:
      - {from: 1, to: 2, files: [{path: checklist.md, status: changed}], risk_flags: []}
      - {from: 2, to: 3, files: [{path: SKILL.md, status: changed}, {path: scripts/lint.sh, status: added, flags: {executable: true, script: true}}], risk_flags: [{kind: runnable_file, path: scripts/lint.sh}], note: "one reason per file: runnable_file, not also non_markdown (the contract); SKILL.md is markdown, so no flag"}

  gate:
    name: gate-skill
    note: >-
      The flags that hold an update (contract §5.3, f4a1df7; 1803115 and its pins at 6532eba): each pair is (installed version, new version) and the risk_flags the
      diff must raise, compared as a set; `from: null` is a first install. One reason per file, the first that applies:
      runnable_file, runs_at_load (one per ! line or block, and no other reason for that file), instructions_changed,
      non_markdown; capability_frontmatter is one flag per key beside the file's own reason. Flags carry path, line, field,
      from and to where they apply. Checked by the shared skill-tree module's diff (slice 4); the core's diff uses the same safe list.
    pairs:
      - {from: gate.g0, to: gate.g0-hooks, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: hooks, from: null}], note: "frontmatter-only change: not also instructions_changed"}
      - {from: gate.g0, to: gate.g0-bang-line, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}]}
      - {from: gate.g0, to: gate.g0-bang-block, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}]}
      - {from: gate.g0, to: gate.g0-fork, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: context, from: null, to: fork}, {kind: capability_frontmatter, path: SKILL.md, line: 5, field: agent, from: null, to: Explore}]}
      - {from: gate.g1, to: gate.g1-steps, risk_flags: [{kind: instructions_changed, path: SKILL.md, detail: "pre-approves Bash(python3 *)"}], note: "new body steps in a skill that pre-approves Bash(python3 *); the detail names the grant, and the flag reads 'its instructions changed while it pre-approves Bash(python3 *)' (6821771)"}
      - {from: gate.g1, to: gate.g1-widened, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: allowed-tools, from: "Bash(python3 *)", to: Bash}], note: "frontmatter-only change: not also instructions_changed"}
      - {from: gate.g0, to: gate.g0-desc, risk_flags: [], note: "description is on the safe list"}
      - {from: gate.g0, to: gate.g0-meta, risk_flags: [], note: "metadata is on the safe list"}
      - {from: gate.g0-dmi, to: gate.g0, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, field: disable-model-invocation, from: true, to: null}], note: "removing a key off the safe list flags"}
      - {from: gate.g0, to: gate.g0-unknown, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: x-future-key, from: null, to: "1"}], note: "an unknown key flags: the gate fails closed"}
      - {from: gate.g0, to: gate.g0-ref, risk_flags: [], note: "a skill with no grants: a changed markdown file raises nothing, so auto applies it"}
      - {from: gate.g1, to: gate.g1-ref, risk_flags: [{kind: instructions_changed, path: reference.md}], note: "the same change in a skill with allowed-tools"}
      - {from: gate.g0, to: gate.g0-cmdpos, risk_flags: [{kind: runnable_file, path: tools/x.txt}], note: "SKILL.md puts tools/x.txt in a command position (python3 x): runnable_file, not also non_markdown; SKILL.md's body change raises nothing in a skill with no grants"}
      - {from: gate.g0, to: gate.g0-script, risk_flags: [{kind: runnable_file, path: scripts/run.sh}], note: "one reason per file: not also non_markdown"}
      - {from: gate.g1, to: gate.g1-notes-bang, risk_flags: [{kind: runs_at_load, path: notes.md, line: 1}], note: "runs_at_load and no other reason for that file, though the skill grants"}
      - {from: null, to: gate.g1, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: allowed-tools, from: null, to: "Bash(python3 *)"}, {kind: instructions_changed, path: SKILL.md}, {kind: instructions_changed, path: reference.md}], note: "a first install is an update from nothing"}
      - {from: null, to: gate.g0, risk_flags: [], note: "a first install of a skill that grants nothing installs"}
      # 682aa08: a ! command counts at a line start or after whitespace; a skill grants when it has a frontmatter key that is
      # neither safe nor in non_granting_keys (model, effort, disable-model-invocation, user-invocable, paths,
      # disallowed-tools), or an injected command.
      - {from: gate.g0, to: gate.g0-bang-inline, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "`- PR diff: !` + command: the ! follows whitespace, so it counts"}
      - {from: gate.g0, to: gate.g0-bang-assign, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "`KEY=!` + command: the detector is wider than Claude Code's rule, so a ! right before a backtick counts anywhere (1803115 reverses 682aa08 here)"}
      - {from: gate.gm, to: gate.gm-edit, risk_flags: [], note: "model is a non-granting key: a body edit gives no instructions_changed"}
      - {from: gate.ga, to: gate.ga-edit, risk_flags: [{kind: instructions_changed, path: SKILL.md}], note: "agent grants: the same body edit gives instructions_changed"}
      - {from: gate.g0-bang-line, to: gate.g0-bang-line-ref, risk_flags: [{kind: instructions_changed, path: reference.md}], note: "an injected command is a grant, so a changed reference.md gives instructions_changed"}

      # 1803115 + 6532eba: the wide detector, command positions, files outside the skill, removals, modes, safe keys,
      # escaped flag text; then the review matrix in its update and first-install cells.
      - {from: gate.g0, to: gate.g0-bang-tab, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a tab before the !"}
      - {from: gate.g0, to: gate.g0-bang-nbsp, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a no-break space before the ! (not whitespace to every rule)"}
      - {from: gate.g0, to: gate.g0-bang-comment, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "inside an HTML comment, right after '<!--'"}
      - {from: gate.g0, to: gate.g0-bang-fenced, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 7}], note: "inside a bash code block: the ! line itself"}
      - {from: gate.g0, to: gate.g0-bang-front, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 3}], note: "in the frontmatter's description; runs_at_load is SKILL.md's one reason"}
      - {from: gate.g0, to: gate.g0-bang-4tick, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a four-backtick ! fence"}
      - {from: gate.g0, to: gate.g0-bang-tilde, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a ~~~! fence"}
      - {from: gate.g0, to: gate.g0-bang-blanks, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "blanks before the fence and between it and the !"}
      - {from: gate.g0, to: gate.g0-bang-doc, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "the wide detector's price: a documented `!` flags too, since the ! is right before a backtick"}
      - {from: gate.g0, to: gate.g0-bang-spaced, risk_flags: [], note: "'Done! `make`': a space after the !, so no command; a markdown change in a skill with no grants raises nothing"}
      # f00eb47 (be4d3594, 66e83a3d): what starts a command is read widely and what ends a block narrowly
      - {from: gate.g0, to: gate.g0-bang-nested, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: runs_at_load, path: SKILL.md, line: 8}], note: "a ```! inside an unclosed ! block starts its own command; the ``` closes both"}
      - {from: gate.g0, to: gate.g0-bang-nested-4tick, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: runs_at_load, path: SKILL.md, line: 8}], note: "a ```! inside a ```` block: its own block, which the ``` closes while the ```` block runs on"}
      - {from: null, to: gate.g0-bang-nested, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: runs_at_load, path: SKILL.md, line: 8}, {kind: instructions_changed, path: reference.md}], note: "first install: the closer closes flagged blocks, so it adds nothing"}
      - {from: gate.g0-bang-indent8, to: gate.g0-bang-indent8-edit, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a ``` indented 8 spaces is content, so the block runs to the end and the edit is inside it"}
      - {from: gate.g0-bang-info, to: gate.g0-bang-info-edit, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "```js isn't a closer (an info string), so the edit is inside the block"}
      - {from: gate.g0-bang-indent3, to: gate.g0-bang-indent3-edit, risk_flags: [{kind: instructions_changed, path: SKILL.md}], note: "a ``` indented 3 spaces closes it: the edit is outside the block"}
      - {from: gate.g0-fence-before, to: gate.g0-fence-before-removed, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a fence line removed in a file with a ! block, flagged at the line now standing where it was; the ! block's text is unchanged"}
      - {from: gate.g0-fence-end, to: gate.g0-fence-end-removed, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 9}], note: "a fence line removed at the end: flagged at the new last line"}
      - {from: gate.g0-bang-block, to: gate.g0-bang-block-plus-code, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 9}], note: "a new plain block in a file with a ! block: one flag, at its opener (its closer closes a flagged block; 41305783)"}
      - {from: gate.g0-bang-plus-code, to: gate.g0-bang-plus-tilde, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 9}], note: "a plain block's fences changed (``` to ~~~): one flag, at its opener (41305783)"}
      - {from: gate.g0-bang-block, to: gate.g0-bang-block-4close, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "the changed closer closes the flagged block: a line is flagged at most once"}
      - {from: gate.g0-bang-4tick, to: gate.g0-bang-4tick-inner, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: runs_at_load, path: SKILL.md, line: 8}], note: "a fence line added inside a flagged ```` block is content, not its opener or closer: flagged too"}
      - {from: gate.g0-bang-4tick-inner, to: gate.g0-bang-4tick, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a content fence line removed from a flagged block: it stands where the block's closer now is, which adds nothing (41305783)"}
      - {from: gate.g0-fence-two, to: gate.g0-fence-two-removed, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: runs_at_load, path: SKILL.md, line: 11}], note: "two fence lines removed apart, each where it was; the order comparison leaves out the removed ones, so the rest match (a1503c97)"}
      - {from: gate.g0-fence-pair, to: gate.g0-bang-block, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "two adjacent fence lines removed stand at one line: flagged once"}
      - {from: gate.g0-bang-indent4, to: gate.g0-bang-indent4-edit, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a ``` indented 4 spaces isn't a closer: the edit is inside the block"}
      - {from: gate.g0-bang-tabindent, to: gate.g0-bang-tabindent-edit, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a tab before ``` isn't a space of indent: content"}
      - {from: gate.g0-bang-4tick-short, to: gate.g0-bang-4tick-short-edit, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a ``` can't close a ```` block: the edit is inside it"}
      - {from: gate.g0-bang-tabclose, to: gate.g0-bang-tabclose-edit, risk_flags: [{kind: instructions_changed, path: SKILL.md}], note: "a closer may end in a tab: the edit is outside the block"}
      - {from: gate.g0-bang-nbspclose, to: gate.g0-bang-nbspclose-edit, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a closer's blanks are space and tab only: ``` then a no-break space is content, so the block runs on"}
      - {from: gate.g0-bang-pull, to: gate.g0-bang-pull-in, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}], note: "a ! block compared whole: its closer moved past a line, which now runs; flagged at its opener only (d0894bc9)"}
      - {from: gate.g0-swap-old, to: gate.g0-swap-new, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 6}, {kind: runs_at_load, path: SKILL.md, line: 12}], note: "a ! block moved above a plain block, same texts (sizes and fences differ, so the shortest diff has one alignment): the diff keeps the plain block, the ! block's fences are new (one flag, 6) and its removed ones stand at the end (12) (d0894bc9, a1503c97)"}
      - {from: gate.g0-bang-block, to: gate.g0-bang-block-prose, risk_flags: [{kind: instructions_changed, path: SKILL.md}], note: "must not fire: prose outside any block edited, the ! block unchanged"}
