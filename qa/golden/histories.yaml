      - {from: null, to: gate.g1-hooks, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: allowed-tools, from: null, to: "Bash(python3 *)"}, {kind: capability_frontmatter, path: SKILL.md, line: 5, field: hooks, from: null}, {kind: instructions_changed, path: SKILL.md}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants, row 1, first install"}
      - {from: null, to: gate.g1-bang-line, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 7}, {kind: capability_frontmatter, path: SKILL.md, line: 4, field: allowed-tools, from: null, to: "Bash(python3 *)"}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants, row 2, first install: runs_at_load is SKILL.md's reason"}
      - {from: null, to: gate.g1-bang-block, risk_flags: [{kind: runs_at_load, path: SKILL.md, line: 7}, {kind: capability_frontmatter, path: SKILL.md, line: 4, field: allowed-tools, from: null, to: "Bash(python3 *)"}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants, row 3, first install"}
      - {from: null, to: gate.g1-fork, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: allowed-tools, from: null, to: "Bash(python3 *)"}, {kind: capability_frontmatter, path: SKILL.md, line: 5, field: context, from: null, to: fork}, {kind: capability_frontmatter, path: SKILL.md, line: 6, field: agent, from: null, to: Explore}, {kind: instructions_changed, path: SKILL.md}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants, row 4, first install"}
