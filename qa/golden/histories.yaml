# Version histories (the QA plan's oracles "Append-only history", "Idempotent republish", "Nothing lost",
# "Change is visible", "Dry run stores nothing"), bound to the contract (§2, §4.4, §5.3).
# Every version's files are written out in full (exact bytes). Expected values are hand-written;
# fingerprints are the test's own (contract §4.3), never read from the system.
# Diff goldens in diffs/ are compared by hunks (@@ lines and +/- lines), ignoring the ---/+++ headers.
#
# Every step, whatever it expects:
# - `storage_unchanged` = the logical snapshot (rows AND blobs) equals the one taken before the step, so a
#   refused publish (not_owner, conflict) leaves no orphan blob (contract §2).
# - A publish result echoes `dry_run` (false when the request didn't set it) and carries `publisher`: the
#   identity the step acts as (`as:`, else the run's one demo identity), never a field of the request.
# - After any step, no version points at a missing blob.
# - Errors carry the contract's fields (§9): `conflict` {name, latest}, `not_owner` {name, owners},
#   `invalid_manifest` {fields}; `name` is the history's skill name.

