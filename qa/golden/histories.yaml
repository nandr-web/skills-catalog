  gate.g1-hooks:
    SKILL.md: "---\nname: gate-skill\ndescription: A plain skill.\nallowed-tools: Bash(python3 *)\nhooks:\n  PreToolUse:\n    - matcher: Bash\n      hooks:\n        - type: command\n          command: echo QA-HOOK-MARKER\n---\nFollow reference.md.\n"
    reference.md: "Step one.\n"
  gate.g1-bang-line:
    SKILL.md: "---\nname: gate-skill\ndescription: A plain skill.\nallowed-tools: Bash(python3 *)\n---\nFollow reference.md.\n!`python3 -c \"print('QA-MARKER')\"`\n"
