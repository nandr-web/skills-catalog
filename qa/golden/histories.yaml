      - {from: gate.g0, to: gate.g0-outside-skills, risk_flags: [{kind: runnable_file, path: SKILL.md, line: 6, to: "~/.claude/skills/other-skill/run.py", detail: "runs a file outside the skill"}], note: "a path into another skills folder"}
      - {from: gate.g0, to: gate.g0-noref, risk_flags: [], note: "a removed file in a skill that grants nothing raises nothing"}
      - {from: gate.g1, to: gate.g1-noref, risk_flags: [{kind: instructions_changed, path: reference.md}], note: "a removed file in a granting skill"}
      - {from: gate.g0, to: gate.g0-refx, risk_flags: [{kind: runnable_file, path: reference.md}], note: "a file made executable: runnable_file, grants or not"}
      - {from: gate.g1, to: gate.g1-refx, risk_flags: [{kind: runnable_file, path: reference.md}], note: "the same in a granting skill"}
      - {from: gate.g1-refx, to: gate.g1, risk_flags: [{kind: instructions_changed, path: reference.md}], note: "a mode change back (no longer runnable) in a granting skill"}
      - {from: gate.g1, to: gate.g1-desc, risk_flags: [{kind: instructions_changed, path: SKILL.md}], note: "a safe key (description) changed in a granting skill"}
      - {from: gate.g1, to: gate.g1-when, risk_flags: [{kind: instructions_changed, path: SKILL.md}], note: "when_to_use added in a granting skill"}
      - {from: gate.g1, to: gate.g1-meta, risk_flags: [{kind: instructions_changed, path: SKILL.md}], note: "any safe key counts, metadata too (6532eba)"}
      - {from: gate.g0, to: gate.g0-longval, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: x-future-key, from: null, to: "\\u{200b}aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa…"}], detail_text: {starts_with: "x-future-key added: \\u{200b}", code_points: 200, ends_with: "…"}, note: "flag text is escaped first (a zero-width space becomes \\u{200b}), then cut to 200 code points ending in …; detail_text: the flag's detail, the same way"}
      - {from: gate.g0, to: gate.g1, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: allowed-tools, from: null, to: "Bash(python3 *)"}], note: "matrix: grants nothing, row 6 (allowed-tools added): frontmatter only, so no instructions_changed"}
