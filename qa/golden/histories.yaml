      - {from: null, to: gate.g0-hooks, risk_flags: [{kind: capability_frontmatter, path: SKILL.md, line: 4, field: hooks, from: null}, {kind: instructions_changed, path: SKILL.md}, {kind: instructions_changed, path: reference.md}], note: "matrix: grants nothing, row 1, first install: hooks grants, so every added file is instructions_changed"}
