# Requirement → oracle → checks for the Skills Catalog (the QA plan, "Requirement → check"), bound to
# the contract. Every requirement needs at least one automated check (`auto: true`); a manual check says
# what would automate it. `qa trace-check` enforces that; that every `golden:` and `backlog:` reference
# resolves; that every item in the requirement list maps to a requirement here, with the same phase; and
# that the discovery question sets haven't drifted.
# Sources: prd = the PRD; notes = the owner's notes on the PRD and later answers; design = the contract,
# where it adds rules the tests must hold.
# phase: 1 (all local: the focus), 2 (local, later), aws (later), later. The owner: "Focus on phase 1 /
# local work."
# Layers: unit, storage, interface, agent, setup, web, perf, cleanup. The web checks are listed in the web plan.

requirements:
  # ---------------- Phase 1: the PRD's core loop ----------------
  - id: publish
    source: {doc: prd, ref: "FR-01 AC1-2, UC-01"}
    backlog: [skill-publish]
    phase: 1
    text: "A developer publishes a skill (manifest + supporting files); it is available to others, complete."
    oracles: [round-trip, same-result-every-face, two-step-publish]
    checks:
      - {layer: storage, name: publish_version then fetch_version equals the fixture, golden: skills.valid, auto: true}
      - {layer: interface, name: publish_skill_to_catalog through CLI and MCP gives the same fingerprint, golden: skills.valid, auto: true}
      - {layer: interface, name: "step 1 (no confirm) lists files, skipped files, diff and risk_flags and stores nothing; step 2 with the token publishes; a folder changed in between gives conflict and stores nothing", golden: skills.hostile, auto: true}
      - {layer: interface, name: "step 1 returns the step-2 inputs (confirm of 43 base64url characters, name, version, files, flags); step 2 sent back as given publishes; a changed name, version, file count, flag set, message or folder content gives conflict {name, folder} with the real path and changes nothing; flags compare as a set", golden: skills.publish_steps, auto: true}
      - {layer: interface, name: "step 2 checks in order: the confirm's form (not_a_confirm), then the HMAC (conflict {name, folder}: a hand-made or another machine's confirm, a replaced key), then the latest (conflict {name, latest}); step-2 inputs without confirm are {field: confirm, why: required}", golden: skills.publish_steps, auto: true}
      - {layer: unit, name: "confirm.key: 32 bytes, 0600, made on first use; a link or a wider mode is replaced (never followed), so earlier confirms stop verifying; a confirm survives a restart", golden: skills.publish_steps, auto: true}
      - {layer: interface, name: "the skipped list: an ignored folder at any depth is one entry with a slash and is never read (a link, fifo or hard link inside doesn't refuse); code-point order; at most 50, then skipped_more", golden: skills.hostile, auto: true}
      - {layer: interface, name: "a path in a command the person is told to run is shell-quoted (bare only for letters, digits and @%+=:,./_-); shlex splits it back to one word; skill names stay bare", golden: skills.command_quoting, auto: true}
      - {layer: agent, name: "A6 one turn: preview, show the files and what's skipped, ask; no confirm; the .env sentinel never leaks", golden: agent.A6, auto: true}
      - {layer: agent, name: A6c publish after the person agreed (step 2 with confirm; the permission prompt), golden: agent.A6c, auto: true}
      - {layer: interface, name: "every publish result echoes dry_run and names the acting identity as publisher", golden: histories.owner, auto: true}

  - id: publish-discoverable
    source: {doc: prd, ref: "UC-01 postcondition: discoverable and retrievable"}
    backlog: [skill-publish]
    phase: 1
    text: "Right after publishing, the skill can be found; after a new version, search shows its new description."
    oracles: [discoverable]
    checks:
      - {layer: storage, name: search finds a skill right after publish_version (the index listens to version_published), auto: true}
      - {layer: interface, name: the card shows the latest description after a new version, golden: histories.prc, auto: true}
      - {layer: interface, name: "catalog_size grows by one with a new name and stays the same with a new version", golden: histories.h1, auto: true}

  - id: publish-rejects-invalid
    source: {doc: prd, ref: "FR-01 AC3, UC-01 exception"}
    backlog: [skill-publish]
    phase: 1
    text: "A skill missing a name, description or body is rejected with an explanation; nothing partial is stored."
    oracles: [all-or-nothing]
    checks:
      - {layer: unit, name: manifest validation table, golden: skills.invalid, auto: true}
      - {layer: storage, name: logical snapshot unchanged after each invalid publish, golden: skills.invalid, auto: true}
      - {layer: storage, name: fault injection (Nth write fails) leaves no version, golden: histories.fault, auto: true}
      - {layer: interface, name: dry_run stores nothing and returns the diff, golden: histories.h1, auto: true}
      - {layer: agent, name: "A7 relays the reason and proposes the fix; never edits the person's files unasked", golden: agent.A7, auto: true}
      - {layer: interface, name: "an error whose fix is a change to the person's files tells the agent to propose it and wait (contract §9)", golden: skills.invalid, auto: true}
      - {layer: unit, name: "frontmatter is a safe YAML subset: a merge key, anchor, alias, explicit tag, duplicate key or second document is invalid_manifest {problem: yaml_feature, feature}; a top-level key outside ^[a-z][a-z0-9_-]*$ (zero-width space, BOM, bidi override, capitals) is {problem: key_format, fields: [the key]}; each problem code as listed", golden: skills.invalid, auto: true}
      - {layer: unit, name: "path rules in the pinned order: invisible characters (no-break, en and ideographic spaces, line and paragraph separators, Hangul filler, Braille blank, variation selectors, private-use, unassigned), not_portable (reserved characters, trailing dot or space, Windows device names, the Windows spellings of .git), full case folding (ß, ẞ, ss clash); the plain space and é pass", golden: skills.path_cases, auto: true}
      - {layer: storage, name: "a .claude or .claude-plugin folder at any depth, compared by NFKC and case (.Claude, .CLAUDE-PLUGIN, a fullwidth full stop), is invalid_path {path, why: claude_folder or plugin_folder} and storage is unchanged; .claude-x and claude are allowed", golden: "skills.hostile, skills.valid", auto: true}
      - {layer: unit, name: "one-line fields: a description with a line break (\\r, \\n, U+2028, U+2029) or a control character (a tab, DEL, C1) is invalid_manifest {problem: control_character, fields: [description]}, checked after too long and before angle brackets; a message with one is invalid_request {field: message, why: control_character}; storage unchanged", golden: skills.one_line_fields, auto: true}
      - {layer: interface, name: "one-line fields stay one line when shown: a description stored before the rule shows its line feed as a space on a search card, so no face prints a forged 'Next:' line; a diff's changed lines sit inside the fence under the data note", golden: skills.one_line_fields, auto: true}
      - {layer: storage, name: "a memory file (CLAUDE.md, CLAUDE.local.md, AGENTS.md) as any segment, after the same fold, is invalid_path {why: memory_file} and storage is unchanged; CLAUDE.md.bak and my-CLAUDE.md are allowed; a trailing dot is not_portable", golden: "skills.hostile, skills.path_cases", auto: true}
      - {layer: unit, name: "a reserved name (a bundled skill, a built-in command, shared-skills the companion skill, skills-catalog the command) is invalid_name {why: reserved}; a near name is allowed; the list the core uses is the repo's dated file of 136 names, not a copy (a name added to a test copy of the file is refused, one removed is allowed)", golden: "skills.invalid, skills.valid", auto: true}

  - id: secrets
    source: {doc: design, ref: "contract §3 publish_skill_to_catalog: secret scan, ignore list"}
    backlog: [skill-publish]
    phase: 1
    text: "A suspected secret stops a publish; only the person can override it (a CLI flag, not in MCP); ignored files are never sent."
    oracles: [secrets-stop-a-publish, stays-in-the-skill-folder]
    checks:
      - {layer: interface, name: secret_suspected with path and line; the ignore list skipped and reported; the MCP schema has no override, golden: skills.hostile, auto: true}
      - {layer: interface, name: "secret_suspected's text never repeats the secret's value (nor the sentinel)", golden: skills.hostile, auto: true}
      - {layer: agent, name: A7s no tool call carries the override, golden: agent.A7s, auto: true}
      - {layer: storage, name: "the core's publish_version runs the same secret scan: a planted secret gives secret_suspected {path, line, kind} and stores nothing, its value never echoed; allow_suspected_secrets: true publishes; no MCP schema carries that field", golden: skills.hostile, auto: true}

  - id: discover
    source: {doc: prd, ref: "FR-02, UC-02"}
    backlog: [skill-discover, skill-search-measure]
    phase: 1
    text: "Through an AI assistant, in natural language, a developer finds skills matching a need; each result has a name and description."
    oracles: [found, through-the-assistant]
    checks:
      - {layer: interface, name: "search recall@5 = 1.0 on the gate set for the adapter's mode (keyword-gate-any for any-word, the contract's) and on each semantic-gap reformulation", golden: queries.keyword-gate-any, auto: true}
      - {layer: interface, name: semantic-gap misses reported (not gated) so a later semantic search shows its gain, golden: queries.semantic-gap-any, auto: true}
      - {layer: interface, name: every card lists matched_words; the common-words list equals the adapter's, golden: queries.corpus, auto: true}
      - {layer: interface, name: "every page says catalog_size 64 on the corpus; total_matches equals the distinct cards across all pages, and is 0 exactly when match is none", golden: queries.corpus, auto: true}
      - {layer: agent, name: "A1, A2 discover by keyword and by paraphrase", golden: "agent.A1, agent.A2", auto: true}
      - {layer: agent, name: "every run records recall, tokens per discovery and first-query time", golden: agent.all, auto: true}

  - id: discover-nothing-matches
    source: {doc: prd, ref: "FR-02 AC3, UC-02 exception"}
    backlog: [skill-discover]
    phase: 1
    text: "When nothing matches, the assistant clearly says so."
    oracles: [nothing-matches]
    checks:
      - {layer: interface, name: "for each no-match query: match is partial or none, and no card's matched_words covers every content word", golden: queries.no-match, auto: true}
      - {layer: agent, name: "A3 sourdough: says none plainly, invents nothing", golden: agent.A3, auto: true}
      - {layer: agent, name: "A3g GraphQL: says nothing fits and never offers sql-migration-writer as a fit", golden: agent.A3g, auto: true}
      - {layer: interface, name: "match follows the index's stemming: 'review pull request' puts pr-review-checklist first with matched_words [review, pull, request] and match all", golden: queries.corpus, auto: true}

  - id: list-and-get-limits
    source: {doc: notes, ref: "uc-01: List with filters; Get a specific skill or skills up to a limit"}
    backlog: [skill-list-get]
    phase: 1
    text: "Search with no words lists skills with filters; read takes several names up to a limit; over a limit is a typed error."
    oracles: [limits-on-reads, found]
    checks:
      - {layer: interface, name: "search with no query and each filter (tags, publisher, updated_since) returns exactly the matching fixtures", golden: queries.corpus, auto: true}
      - {layer: interface, name: "tags filter: [docs] returns exactly tagged, tags-deduped, tags-at-limit; [docs, release] only the skills with both; a top-level tags list is never a tag", golden: skills.valid, auto: true}
      - {layer: unit, name: "metadata.tags parsing: trimmed, deduplicated in order, ≤10 of 1-32 [a-z0-9-]; each bad form is invalid_manifest {fields: [metadata.tags]}", golden: "skills.valid, skills.invalid", auto: true}
      - {layer: interface, name: "read_shared_skill with 20 names works; 21 gives invalid_request {field: names, limit: 20}; search limit 51 gives invalid_request {field: limit, limit: 50}; each with a why", auto: true}
      - {layer: interface, name: "search's tags filter: 11 tags gives invalid_request {field: filters.tags, why: too_many, limit: 10}; a 33-character tag gives {why: too_long, limit: 32}; 10 tags with one of 32 characters is accepted; never clamped", golden: skills.search_filters, auto: true}
      - {layer: interface, name: "read_shared_skill's inputs: name and names both is {field: names, why: name_and_names}; neither is {field: name, why: required}; paths with names is {field: paths, why: paths_need_one_name}", golden: skills.reads, auto: true}
      - {layer: interface, name: cursor paging returns every skill once while publishes happen, golden: scale.10k, auto: true}

  - id: retrieve
    source: {doc: prd, ref: "FR-03, UC-03"}
    backlog: [skill-retrieve]
    phase: 1
    text: "Through an AI assistant, a developer retrieves a named skill, complete and unchanged."
    oracles: [round-trip, through-the-assistant]
    checks:
      - {layer: interface, name: "read_shared_skill include: contents equals the fixture's text files", golden: skills.valid, auto: true}
      - {layer: interface, name: "include: files types each file by its bytes (only logo.png is binary); include: contents gives content for every text file, SKILL.md included, encoding back to the exact bytes; never for a binary", golden: skills.valid, auto: true}
      - {layer: interface, name: "a read inlines at most the 24,576-byte budget in every mode: every named skill's body first, then with contents each skill's files (SKILL.md first, then by path); each body or file whole or left out (body_omitted, content_omitted), a later smaller one still fits, inline_budget {limit, used, omitted}; a file over the whole budget is named in the too_big sentence, which points to reading it alone; 20 median-sized names in manifest mode stay under 8,000 tokens; paths[] reads just those files in the order asked, the body just before SKILL.md's content when SKILL.md is asked, both counted; one path is inlined whatever its size (limit stays 24,576, used exceeds it); a missing one is not_found {path}, 21 paths or paths with names is invalid_request", golden: skills.reads, auto: true}
      - {layer: interface, name: install_shared_skill writes the same tree and a lock entry, golden: skills.valid, auto: true}
      - {layer: interface, name: "the fence: a read's skill text sits between one start and one end marker carrying the injected token; markers planted in SKILL.md in any spelling never close it; paths and names outside it are JSON-quoted", golden: skills.fence, auto: true}
      - {layer: interface, name: "install refuses to overwrite: a hand-made folder of that name in the target gives exists_untracked {path}, untouched; an untracked same-named skill in the other target gives name_in_use {path}, and so does a command file .claude/commands/<name>.md in either target; a tampered lock path never redirects an update (the path is target + name)", auto: true}
      - {layer: agent, name: A4 installs the skill intact, golden: agent.A4, auto: true}

  - id: retrieve-not-found
    source: {doc: prd, ref: "FR-03 AC3, UC-03 exception"}
    backlog: [skill-retrieve]
    phase: 1
    text: "Retrieving a skill that doesn't exist returns a clear 'not found'."
    oracles: [not-found]
    checks:
      - {layer: interface, name: "not_found per name on every face, with suggestions by spelling only", golden: skills.missing-names, auto: true}
      - {layer: agent, name: "A5 says not found, installs nothing, invents nothing, offers no search-based closest", golden: agent.A5, auto: true}

  - id: end-to-end
    source: {doc: prd, ref: "Goals row 1: Developer 1 publishes; Developer 2, through an AI assistant, discovers and retrieves the same skill"}
    backlog: [skill-end-to-end]
    phase: 1
    text: "One run: Developer 1 publishes; Developer 2's assistant, asked in plain words, finds and installs the same skill."
    oracles: [round-trip, through-the-assistant]
    checks:
      - {layer: agent, name: "A16: dev1 publishes (SKILLS_AS=dev1); dev2's assistant finds and installs it; fingerprints equal; results say acting_as dev2", golden: agent.A16, auto: true}

  - id: version-new
    source: {doc: prd, ref: "FR-04 AC1, UC-04"}
    backlog: [skill-versions]
    phase: 1
    text: "Publishing an existing name creates a new version; prior versions are retained; nothing is silently overwritten."
    oracles: [append-only-history, idempotent-republish, nothing-lost]
    checks:
      - {layer: storage, name: history steps, golden: histories.h1, auto: true}
      - {layer: storage, name: 20 publishes from separate processes all land; stale expected_latest conflicts, golden: histories.concurrent, auto: true}
      - {layer: storage, name: "two publishes race on one expected_latest: one lands, the other conflicts; no orphan blob, and every version is still retrievable", golden: histories.concurrent, auto: true}
      - {layer: storage, name: "expected_latest 0 means a new name: it creates version 1, and conflicts on a name that exists, storing nothing", golden: histories.owner, auto: true}
      - {layer: unit, name: version numbering property test under random interleavings, auto: true}

  - id: version-history-visible
    source: {doc: prd, ref: "FR-04 AC2, goals row 2"}
    backlog: [skill-versions]
    phase: 1
    text: "A developer can see a skill's version history, and the change is visible."
    oracles: [append-only-history, change-is-visible]
    checks:
      - {layer: interface, name: list_shared_skill_versions and diff_shared_skill_versions equal the goldens (with risk_flags), golden: histories.h1, auto: true}
      - {layer: agent, name: A8 says what changed, golden: agent.A8, auto: true}

  - id: version-latest-default
    source: {doc: prd, ref: "FR-04 AC3, UC-04 postcondition"}
    backlog: [skill-versions]
    phase: 1
    text: "Retrieve returns the latest version by default; an earlier version when asked."
    oracles: [append-only-history, round-trip]
    checks:
      - {layer: storage, name: get and get version k per history step, golden: histories.h1, auto: true}
      - {layer: interface, name: "reading version k also says latest_version, the current latest", golden: histories.h1, auto: true}
      - {layer: agent, name: A9 installs version 1 on request, golden: agent.A9, auto: true}

  - id: version-malformed-untouched
    source: {doc: prd, ref: "UC-04 exception"}
    backlog: [skill-versions]
    phase: 1
    text: "A malformed update is rejected; existing versions are untouched."
    oracles: [all-or-nothing, append-only-history]
    checks:
      - {layer: storage, name: the malformed step in the history, golden: histories.h1, auto: true}

  - id: consistency
    source: {doc: prd, ref: "NFR consistency"}
    backlog: [skill-unchanged]
    phase: 1
    text: "A retrieved skill is complete and unchanged from what was published."
    oracles: [round-trip]
    checks:
      - {layer: unit, name: "round-trip property test over generated trees (paths, bytes, modes)", auto: true}
      - {layer: storage, name: round trip on every adapter, golden: skills.valid, auto: true}
      - {layer: storage, name: "a failed publish deletes the blobs it created (not ones it found); a killed process or a failed delete leaves them, and the next open removes them only once over an hour old (injected clock); a blob shared with a version, or written by a publish in flight, is never removed", golden: histories.fault, auto: true}
      - {layer: storage, name: "a publish that fails and deletes its blob never breaks a concurrent publish of the same content: that one re-puts the blob and lands", golden: histories.fault, auto: true}
      - {layer: storage, name: "no version ever points at a missing blob: a retry of hour-old leftovers lands (put-if-absent refreshes their time); a publish stalled over an hour lands (the append re-puts a removed blob under the write lock); a failed re-put stores no version", golden: histories.fault, auto: true}

  - id: assistant-mediated
    source: {doc: prd, ref: "NFR assistant-mediated access, D1"}
    backlog: [skill-assistant-access]
    phase: 1
    text: "Discover and retrieve happen through an AI assistant acting on natural-language intent."
    oracles: [through-the-assistant]
    checks:
      - {layer: agent, name: every scenario's trace shows a catalog call before the answer, golden: agent.all, auto: true}

  - id: responsiveness
    source: {doc: prd, ref: "NFR responsiveness"}
    backlog: [skill-responsive]
    phase: 1
    text: "Discovery and retrieval feel interactive within an assistant conversation."
    oracles: [budgets]
    checks:
      - {layer: perf, name: "search/read/publish p95 on the 10,000-skill corpus", golden: scale.10k, auto: true}
      - {layer: perf, name: update at session start for 50 skills; initialize answered first, auto: true}
      - {layer: agent, name: median scenario wall time and catalog calls, golden: agent.all, auto: true}

  - id: time-box
    source: {doc: prd, ref: "Constraints: time-boxed (~4 hours); a smaller, coherent, working system beats a larger broken one"}
    backlog: [skill-time-box]
    phase: 1
    text: "Everything in the submission passes its tests; what isn't built is shown as design."
    oracles: [clean-run]
    checks:
      - {layer: cleanup, name: "qa run phase1 passes on the submission commit, from a fresh copy of the repo", auto: true}
      - {layer: unit, name: "every phase-1 requirement's checks exist and run; later items are listed as design in the README", auto: true}

  # ---------------- Phase 1: from the owner's notes and answers ----------------
  - id: qa-clean-runs
    source: {doc: notes, ref: goals}
    backlog: [skill-qa-first]
    phase: 1
    text: "Automation is reproducible, cleans up after itself and makes no permanent changes."
    oracles: [clean-run]
    checks:
      - {layer: cleanup, name: before/after check (folders and files) equal after every run, auto: true}
      - {layer: cleanup, name: leaky canary makes the check fail, auto: true}
      - {layer: cleanup, name: "assistant-run leftovers (projects, session-env, tmp, and the MCP-log cache ~/Library/Caches/claude-cli-nodejs/<working-folder slug>/) removed by session id and sandbox path; each server's log is first kept with the run's transcripts", auto: true}
      - {layer: cleanup, name: "pre-flight starts the catalog's MCP server with exactly the runs' settings (environment, paths, MCP config), and a server that dies at start stops the round", auto: true}
      - {layer: agent, name: "no_read_outside_sandbox holds in every run: reads are allowed only under the sandbox, and the MCP setups have no Bash", golden: agent.all, auto: true}

  - id: qa-no-secrets-in-runs
    source: {doc: design, ref: "security review of the QA tools: the assistant under test got the runner's whole environment"}
    backlog: [skill-qa-first]
    phase: 1
    text: "No secret variable reaches the assistant under test or any MCP server it starts: both get only an allow-listed environment; the real HOME is the one documented exception (the assistant's sign-in lives there)."
    oracles: [no-secrets-in-the-run]
    checks:
      - {layer: unit, name: "the child environment is exactly the allow-list (PATH, HOME, USER, LOGNAME, SHELL, TMPDIR, LANG, LC_*, TERM, SKILLS_*, QA_*): given a parent with AWS_*, GITHUB_TOKEN, GH_TOKEN, ANTHROPIC_API_KEY, NPM_TOKEN, SSH_AUTH_SOCK and an ordinary-named MY_NOTES carrying markers, none is kept", auto: true}
      - {layer: cleanup, name: "a fake assistant and the MCP server started from the run's own mcp.json each record their environment: no planted marker, and only allow-listed names", auto: true}
      - {layer: agent, name: "every live run: a marker planted in the runner's environment never appears in any tool result or answer", golden: agent.all, auto: true}
      - {layer: unit, name: "fail-safe guard is on in every run, and trips when HOME points elsewhere (real home from the OS)", auto: true}
      - {layer: unit, name: "safe deletion: a symlinked base deletes nothing; a symlinked run folder is skipped; a run id with '..' is rejected; a live run is kept; an entry without run.json is skipped, never judged by mtime", auto: true}
      - {layer: unit, name: "safe deletion outside the base: only the run's own leftovers; a non-UUID session id, a slug outside the base's prefix or colliding with another run, and a path differing only in case are refused", auto: true}
      - {layer: unit, name: "tests of teardown and the janitor use a fake home and tmp root; a test resolving a deletion path under the real ones fails", auto: true}
      - {layer: cleanup, name: "qa janitor --dry-run lists what it would delete and deletes nothing", auto: true}

  - id: agent-first
    source: {doc: notes, ref: goals}
    backlog: [skill-agent-first, skill-agent-qa]
    phase: 1
    text: "Everything is agent-first, with an MCP and/or skill; the agent-level experience is QA'd first and constantly."
    oracles: [through-the-assistant, same-result-every-face, budgets]
    checks:
      - {layer: agent, name: access matrix (MCP / MCP + skill / skill + CLI) per scenario, golden: agent.all, auto: true}
      - {layer: interface, name: every phase-1 operation marked MCP is in tools/list; the server sends its instructions; the companion skill names only real tools, auto: true}
      - {layer: interface, name: "an internal error gives internal_error {log}: no traceback in CLI or MCP output; the traceback is in a log under $SKILLS_HOME", auto: true}
      - {layer: interface, name: "the name is skills-catalog everywhere: CLI, package, MCP server; the companion skill is shared-skills", auto: true}
      - {layer: agent, name: "the assistant asks run before every merge: Claude Haiku on all of them, Claude Opus on the core asks", golden: agent.all, auto: true}
      - {layer: interface, name: "the MCP activity log (SKILLS_ACTIVITY_LOG, mode 0600): one line per tool call, HH:MM:SS in UTC from the injected clock, who, tool, target, result, split on double spaces, no colour codes; the target is skill names and versions only, a search logs '<n> of <total> match'; results are the words file's fixed words; a sentinel planted in a search's words and in a publish message never appears in it", auto: true}

  - id: backend-neutral-api
    source: {doc: notes, ref: uc-01}
    backlog: [skill-backend-neutral, skill-scale-plan]
    phase: 1
    text: "The interface and contracts don't couple to a storage choice; agents search and read with progressive disclosure."
    oracles: [same-result-every-face, round-trip, budgets]
    checks:
      - {layer: storage, name: "one suite unchanged on every adapter (SQLite + folder now; others plug in later)", auto: true}
      - {layer: agent, name: "A11 finds a skill in a 10,000-skill catalog within the tool-result budget", golden: agent.A11, auto: true}
      - {layer: interface, name: "request fields are the operation's own: constructor, __proto__, toString and hasOwnProperty as request fields give invalid_request {field} on every operation, through the core and each face, and change nothing", golden: skills.request_fields, auto: true}

  - id: auto-updates
    source: {doc: notes, ref: "personas; the owner's answer on auto-updates"}
    backlog: [skill-auto-updates]
    phase: 1
    text: "Auto-updates are on by default, global and overridable per skill; an update that raises a risk flag stops and shows it."
    oracles: [update-gate, local-edits-replaced]
    checks:
      - {layer: unit, name: update gate table, golden: policy.table, auto: true}
      - {layer: unit, name: "the diff's risk_flags for each gate pair: runs_at_load by the wide detector (any ! right before a backtick, anywhere: a tab, a no-break space, KEY=, an HTML comment, a code block, the frontmatter; a fence of 3+ backticks or tildes then !; one per block at its opening line, an edit inside an unchanged block included), capability_frontmatter per key off the safe list (hooks, context, agent, allowed-tools widened, disable-model-invocation removed, an unknown key), instructions_changed only when the new version grants (a key neither safe nor non-granting, or an injected command) for a file added, changed (bytes or mode) or removed and for SKILL.md when its body or any safe key changed, runnable_file for an executable, a script or a command position (python, uv run, bun, deno, '. x', ${CLAUDE_SKILL_DIR}/x, an injected command's target), and {path: SKILL.md, line, to, detail: runs a file outside the skill} for a target outside it, with or without a grant; one reason per file, field/from/to/line carried; the safe list raises nothing without a grant", golden: histories.gate, auto: true}
      - {layer: unit, name: "the review matrix: six changes × a skill that grants something or nothing × update or first install; every cell held, except new body steps without a grant (applied or installed: Claude Code's own prompts stay the gate)", golden: histories.gate, auto: true}
      - {layer: unit, name: "flag text (path, from, to, detail) is plain text: invisible characters escaped as \\u{XXXX}, then cut to 200 code points ending in …; never rendered as markdown on any face", golden: histories.gate, auto: true}
      - {layer: interface, name: "the installer decides from bytes it checked: each fetched version re-validated with today's rules; the newest failing one is refused {version, error} with the lock and installed copy unchanged and no fallback to an older version; an unparseable SKILL.md is refused, never diffed as empty; a name reserved since is invalid_name at install and every sync; a catalog row that claims no flags still gives the installer's own flags", golden: histories.installer, auto: true}
      - {layer: unit, name: "safe_frontmatter_keys and non_granting_keys are fixed in code: a config can remove keys, and a config that adds one is refused by setup (invalid_request {field}, nothing written, exit 1)", auto: true}
      - {layer: interface, name: "a first install goes through the gate whatever the policy: a flagged skill gives held: flagged with a confirm, accept_held_update installs it; an unflagged one installs", golden: "policy.table, histories.gate", auto: true}
      - {layer: interface, name: "update_installed_skills replaces a hand-edited copy and records version and fingerprint in the lock (phase 1: the owner's decision)", golden: histories.prc, auto: true}
      - {layer: agent, name: A10 update my skills, golden: agent.A10, auto: true}
      - {layer: agent, name: A10u an unattended update holds a flagged change, golden: agent.A10u, auto: true}
      - {layer: agent, name: "A10n the hold is reported when the next session starts: a system message names it, and the assistant relays it", golden: agent.A10n, auto: true}
      - {layer: setup, name: "the session-start hook: while an update is held it prints JSON with systemMessage and additionalContext; with nothing held it prints nothing", auto: true}
      - {layer: setup, name: "the session-start hook always exits 0, even with the catalog missing or broken, and stops syncing after 2 seconds", auto: true}
      - {layer: setup, name: "the 'synced recently' stamp stops a second sync at MCP start", auto: true}
      - {layer: setup, name: "teardown removes the hook and restores settings.json byte for byte", auto: true}
      - {layer: manual, name: "how the interactive terminal shows the session-start message, looked at once", auto: false, automate_by: "a pseudo-terminal screen snapshot approved once"}
      - {layer: agent, name: A10g a held update is relayed to the person and never accepted by the assistant, golden: agent.A10g, auto: true}
      - {layer: interface, name: "accept_held_update with the held result's confirm installs that version, and the lock records the flags it let through", golden: histories.prc, auto: true}
      - {layer: interface, name: "accept_held_update's flags[] is compared with the held flags as a set (order and repeats ignored); a missing or extra kind is conflict and changes nothing (the accept_cases)", golden: "policy.table, histories.prc", auto: true}
      - {layer: interface, name: "MCP schemas: install_shared_skill has no policy input (the CLI's --policy only), update_installed_skills has no latest, accept_held_update requires flags", auto: true}
      - {layer: unit, name: "accept_flagged_updates never applies to a first install (the first-install row with accept: true stays held: flagged)", golden: policy.table, auto: true}
      - {layer: interface, name: "a newer version published between hold and accept gives conflict and changes nothing; a confirm for another name or version is refused", golden: histories.prc, auto: true}
      - {layer: setup, name: "setup's allowed tools never include accept_held_update, publish_skill_to_catalog or set_skill_update_policy; update_installed_skills is pre-allowed for MCP only (the CLI's update still asks)", auto: true}
      - {layer: setup, name: "accept_flagged_updates is set only by the terminal wizard: true from --config, --yes or the no-terminal mode is refused (invalid_request {field: accept_flagged_updates}, nothing written, exit 1); while it's on, the session-start notice says so", auto: true}

  - id: review-flags
    source: {doc: notes, ref: "the owner's notes on dependencies and on auto-updates: a rules reviewer in phase 1"}
    backlog: [skill-review-flags, skill-reviewer-tenet, skill-quality-reviews]
    phase: 1
    text: "A built-in rules reviewer flags scripts, tool grants, a publisher change, prompt-injection patterns and context cost; findings are grounded; a clean skill gets none."
    oracles: [reviews-grounded-and-quiet]
    checks:
      - {layer: unit, name: "every flagged fixture gets exactly its expected findings, each grounded (path, line, evidence on that line)", golden: skills.flagged, auto: true}
      - {layer: unit, name: "every valid fixture gets a review with no findings", golden: skills.valid, auto: true}
      - {layer: unit, name: "the 64-skill discovery corpus gets no findings (no noise on good skills)", golden: queries.corpus, auto: true}
      - {layer: interface, name: "a card carries quality only when the skill is flagged; read returns reviews; install and update return advisories", auto: true}
      - {layer: unit, name: "one reason per file: a script path gets runnable_file only, never also non_markdown", golden: histories.prc, auto: true}
      - {layer: agent, name: A13 the assistant is warned about a skill with a planted instruction, golden: agent.A13, auto: true}

  - id: owner-only-publish
    source: {doc: notes, ref: "the owner's answer on hosted access: only owners can publish"}
    backlog: [skill-owner-only-publish]
    phase: 1
    text: "Locally, in the core: the first publisher owns a name; anyone else's publish gets not_owner and stores nothing; the recorded publisher is the acting identity."
    oracles: [only-owners-publish]
    checks:
      - {layer: storage, name: "publish as dev2 of dev1's skill gives not_owner {owners}, preview included; the snapshot (rows and blobs) is unchanged", golden: histories.owner, auto: true}
      - {layer: interface, name: "every version's publisher equals the acting identity, never a field in the request", golden: histories.owner, auto: true}

  - id: demo-identity
    source: {doc: notes, ref: "the owner's answer on hosted access: impersonate other developers locally, with a discreet 'for demo purposes' label"}
    backlog: [skill-demo-identity]
    phase: 1
    text: "Without sign-in, a person picks who they act as (flag, setting or MCP config); every result says who; the CLI shows one discreet demo line."
    oracles: [demo-identity]
    checks:
      - {layer: interface, name: "--as, SKILLS_AS and the MCP server's config each set acting_as; every result carries it", auto: true}
      - {layer: interface, name: "the CLI prints exactly one line '(Acting as <developer>, for demo purposes.)', last, after every result and every error, and none in --json output", auto: true}
      - {layer: interface, name: "locally with no acting identity, a publish is unauthenticated and its sentence points to setup's me or --as", auto: true}
      - {layer: interface, name: "a developer name follows the skill-name rule: --as with a space or a line feed is invalid_request {field: --as, why: not_a_developer_name} (a request field names itself); a bad SKILLS_AS, MCP config name or setup me is invalid_developer_setting {setting}, saying to fix the setting; nothing runs", golden: skills.one_line_fields, auto: true}

  - id: runs-from-readme
    source: {doc: prd, ref: "Constraints: self-contained, short README; the owner's answer on scope and delivery"}
    backlog: [skill-readme-run, skill-readme-visual]
    phase: 1
    text: "It runs on a reviewer's machine from a very simple, visual README: an architecture diagram, one command with a guided setup, links to other documents."
    oracles: [readme-walk]
    checks:
      - {layer: setup, name: README quickstart run word for word in a fresh home (npm prefix and caches in the sandbox), auto: true}
      - {layer: setup, name: "README lint: exactly one quickstart command; an architecture diagram that renders (light and dark); every link resolves", auto: true}

  - id: local-by-default
    source: {doc: notes, ref: "the owner's answer on scope and delivery: AWS optional, off by default; everything local by default"}
    backlog: [skill-local-default]
    phase: 1
    text: "The guided setup runs everything locally by default (hosting: local) and offers AWS, off by default; phase 1 needs nothing outside the machine."
    oracles: [local-by-default]
    checks:
      - {layer: setup, name: "setup with every default writes hosting: local and a local catalog, and never reads a sentinel AWS profile", auto: true}
      - {layer: cleanup, name: "the whole phase-1 run passes with the network to AWS blocked", auto: true}

  - id: setup-cli-and-agent
    source: {doc: notes, ref: "personas: CLI installer and a prompt for an agent; welcoming, colourful; auto-updates default yes"}
    backlog: [skill-setup-welcome, skill-setup-by-agent]
    phase: 1
    text: "Setup through a guided CLI, or by an assistant from the setup skill or the setup doc; welcoming and colourful; asks about auto-updates, default yes."
    oracles: [setup-one-config, teardown-restores]
    checks:
      - {layer: setup, name: "wizard through a pseudo-terminal: Enter at the auto-update prompt means yes; AWS prompt defaults to no", auto: true}
      - {layer: setup, name: "--yes means auto-updates on and hosting local", auto: true}
      - {layer: agent, name: A12 set it up from the README's hand-off prompt, golden: agent.A12, auto: true}
      - {layer: agent, name: "A12s a vague ask never touches the assistant's own settings", golden: agent.A12s, auto: true}
      - {layer: agent, name: A12p a partial preference is carried and the open questions relayed, golden: agent.A12p, auto: true}
      - {layer: agent, name: A15 set it up by reading the README, golden: agent.A15, auto: true}
      - {layer: agent, name: A14 teardown puts things back, golden: agent.A14, auto: true}
      - {layer: setup, name: teardown leaves the assistant home byte-identical to before setup, auto: true}
      - {layer: setup, name: "setup's result leads with the remaining step and 'N skills to search; none installed yet'", auto: true}
      - {layer: setup, name: "the written settings allow exactly the contract §6 MCP tools and shell prefixes, no more, and the CLI allow list equals the registry's read-only commands (search, read, versions, diff, list); the hook and the MCP entry start node by process.execPath, never a shim, npx or a bare name", auto: true}
      - {layer: setup, name: "the pre-allowed read-only commands never write: pointed with --catalog and --home at an empty folder they fail or read, and the folder stays empty (no catalog created, no sweep, no index rebuilt)", auto: true}
      - {layer: setup, name: "--accept or --allow-suspected-secrets with no terminal exits 3 and changes nothing", auto: true}
      - {layer: setup, name: "the session-start notice never contains a publisher-chosen string: a sentinel planted in a skill's path and description is absent from it", auto: true}
      - {layer: manual, name: the owner watches a recording of the wizard, auto: false, automate_by: "pseudo-terminal screen snapshots approved once"}

  - id: setup-unattended
    source: {doc: notes, ref: "personas: unattended setup via CLI (all configuration or a file)"}
    backlog: [skill-setup-unattended]
    phase: 1
    text: "Unattended setup via CLI, passing all configuration or a file; the setting can be changed later by CLI or file."
    oracles: [setup-one-config]
    checks:
      - {layer: setup, name: "--config gives the same config as the wizard with the same answers; closed stdin never waits", auto: true}
      - {layer: setup, name: "no terminal and no --yes/--config: prints every question with its flag and the --yes line, exits 3, changes nothing (before/after check)", auto: true}
      - {layer: unit, name: "one question list: the wizard's questions, the flags, the --config schema and the no-terminal output match (parity)", auto: true}
      - {layer: setup, name: "exit codes: 0 done, 1 error, 3 needs answers", auto: true}
      - {layer: setup, name: set_skill_update_policy and a hand edit of config.json both change the effective policy, golden: policy.table, auto: true}

  # ---------------- Phase 2 (local, later) ----------------
  - id: web-view-update
    source: {doc: notes, ref: goals}
    backlog: [skill-web-ui, skill-web-mockups]
    phase: 2
    text: "View and update skills from a web UI (served locally)."
    oracles: [same-result-every-face]
    checks:
      - {layer: web, name: Playwright view and publish on the local server (the web plan), auto: true}
      - {layer: manual, name: the owner reviews the mock-ups, auto: false, automate_by: "Playwright screenshot goldens once approved"}

  - id: web-delta
    source: {doc: notes, ref: goals}
    backlog: [skill-web-delta]
    phase: 2
    text: "A delta view of changes across revisions."
    oracles: [change-is-visible]
    checks:
      - {layer: web, name: the page's diff equals the golden diff, golden: histories.h1, auto: true}

  - id: bundles
    source: {doc: notes, ref: goals}
    backlog: [skill-bundles]
    phase: 2
    text: "Group skills into a bundle and share it."
    oracles: [round-trip]
    checks:
      - {layer: interface, name: a bundle installs exactly its pinned versions, auto: true}

  - id: quality-agent-reviews
    source: {doc: notes, ref: "the owner's notes on dependencies: pluggable agent reviewers"}
    backlog: [skill-quality-reviews]
    phase: 2
    text: "Pluggable independent agent reviewers; grounded findings; approve without comments when good; measurements reach every entry point."
    oracles: [reviews-grounded-and-quiet]
    checks:
      - {layer: agent, name: "known-good skills approved with no comments (≥ 95%); known-bad flagged", auto: true}
      - {layer: unit, name: every finding cites an existing file and line that supports it, auto: true}

  # ---------------- AWS and later ----------------
  - id: aws-deploy
    source: {doc: notes, ref: goals}
    backlog: [skill-web-aws]
    phase: aws
    text: "Deploys into the owner's AWS account, optional and off by default."
    oracles: [clean-run, same-result-every-face, budgets]
    checks:
      - {layer: web, name: CDK assertions and cdk-nag, auto: true}
      - {layer: storage, name: "the suite on moto every change and on a throwaway stack on request, destroyed after", auto: true}
      - {layer: cleanup, name: janitor finds leftovers by run tag and by name prefix (untagged log groups), auto: true}

  - id: signed-in-read
    source: {doc: notes, ref: "the owner's answer on hosted access: everyone (signed in) can read"}
    backlog: [skill-signed-in-read]
    phase: aws
    text: "On the hosted catalog, a read without a valid sign-in or token is refused; every signed-in person can read."
    oracles: [only-owners-publish]
    checks:
      - {layer: web, name: no or revoked token gives 401; a signed-in read works (the web plan), auto: true}

  - id: update-cooldown
    source: {doc: notes, ref: "the owner's answer on the update cooldown: wait by default on a shared catalog, with a way to force-request the latest"}
    backlog: [skill-update-cooldown]
    phase: aws
    text: "On a shared or hosted catalog a new version waits (about 3 days by default) before auto-update applies it; the latest comes at once on request, through the person's permission prompt and still through the update gate; a version flagged or withdrawn during the wait is never auto-applied; a local catalog doesn't wait."
    oracles: [update-gate, held-updates]
    checks:
      - {layer: unit, name: "with an injected clock: a version younger than the cooldown gives held: cooldown with its until and applies at until; a first install of a version that young is held the same way unless the person names the version; the default is 0 for a local catalog (never held: cooldown) and about 3 days for a shared or hosted one", auto: true}
      - {layer: interface, name: "the latest on request: a watcher policy (cooldown 0), update --latest and accepting a held: cooldown update each take the new version at once and still stop on a flag; update_installed_skills has no latest input over MCP; setup pre-allows none of the three", auto: true}
      - {layer: interface, name: "a version flagged by a review or withdrawn during its wait is never auto-applied, at the end of the wait or on any sync", auto: true}

  - id: owner-permissions
    source: {doc: notes, ref: "the owner's answer on hosted access: later, owners can assign permissions to others"}
    backlog: [skill-owner-permissions]
    phase: later
    text: "An owner adds and removes maintainers; a maintainer's publish succeeds; anyone else still gets not_owner."
    oracles: [only-owners-publish]
    checks:
      - {layer: storage, name: maintainer add/remove changes who can publish; a removed maintainer gets not_owner, auto: true}

  - id: bundle-votes
    source: {doc: notes, ref: "goals: community feedback like votes"}
    backlog: [skill-bundle-votes]
    phase: later
    text: "A signed-in person votes once per bundle and can take it back."
    oracles: [only-owners-publish]
    checks:
      - {layer: interface, name: one vote per identity per bundle; unvote works; an unsigned request can't vote, auto: true}

  - id: merge-share-suggestions
    source: {doc: notes, ref: "personas: long-term, pass over one's own skills to merge with others / share"}
    backlog: [skill-merge-share-suggestions]
    phase: later
    text: "Suggest near-duplicates to merge and unpublished skills worth sharing; change nothing on its own."
    oracles: [clean-run, found]
    checks:
      - {layer: interface, name: "lists the hand-labelled near-duplicate pairs from the discovery corpus; the before/after check shows nothing changed", golden: queries.corpus, auto: true}

  - id: recommend-from-sessions
    source: {doc: notes, ref: "personas: long-term, sample one's own sessions and auto-recommend skills"}
    backlog: [skill-recommend-from-sessions]
    phase: later
    text: "Recommend catalog skills from needs found in recent sessions; the analysis stays on the developer's machine."
    oracles: [found, budgets]
    checks:
      - {layer: interface, name: "made-up session transcripts with labelled needs give the labelled skills", auto: true}
      - {layer: cleanup, name: "a sentinel planted in the transcripts never leaves the machine (no request body or log carries it)", auto: true}
