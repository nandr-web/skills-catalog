    held_review: '{name} v{version} was NOT installed yet: the catalog''s review found what the person should know first: {reasons}. Tell the person each reason in plain words and ask whether to install it. Only if they agree: ${accept} with name "{name}", target "{target}", version {version}, confirm "{confirm}" and flags {flags}, all exactly as given here.'
    held_review_cli: "{name} v{version} was NOT installed yet: the catalog's review found what the person should know first: {reasons}. Tell the person each reason in plain words. Don't install it yourself: the person does, by running {command} in their own terminal."
    held_over_review: '{name} v{version} was NOT installed: {name} v{from} is installed here, and the catalog''s review of v{version} found what the person should know first: {reasons}. Tell the person each reason in plain words and ask whether to take v{version}. Only if they agree: ${accept} with name "{name}", target "{target}", version {version}, confirm "{confirm}" and flags {flags}, all exactly as given here.'
    held_over_review_cli: "{name} v{version} was NOT installed: {name} v{from} is installed here, and the catalog's review of v{version} found what the person should know first: {reasons}. Tell the person each reason in plain words. Don't install it yourself: the person does, by running {command} in their own terminal."
