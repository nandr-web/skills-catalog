    live: "You can use it in this session as /{name}. If the Skill tool says it is unknown, wait a moment and try once more: the assistant notices new skills shortly after they are installed."
  errors:
    not_found: 'not_found: no skill named "{name}" in the shared catalog.{suggest} Nothing was changed.'
    not_found_suggest: " Names like it: {names}."
    not_found_next: "Next: ${search} with words from the task, or tell the user it isn't in the catalog."
    not_found_next_cli: "Next: search the catalog with a few words from the task, or tell the user it isn't in the catalog."
    invalid_confirm_held: "invalid_request: that confirm value isn't one a held install or update gives (it may have been cut or changed in copying), so nothing was installed. Run the install or update again, tell the person what it holds and why, and use the new values once they say yes."
    invalid_confirm_held_cli: "invalid_request: that confirm value isn't one a held install or update gives, so nothing was installed. Run the install or update again; a held one is taken with ${cli} update <name> --accept in the person's own terminal."
    invalid_confirm: "invalid_request: that confirm value isn't one a preview gives (it may have been cut or changed in copying), so nothing was published. Preview again (${publish} with just the folder), show the person the lists, and use the new values once they say yes."
    not_installed: "not_installed: {name} isn't installed on this machine, so nothing was changed. To see what is: ${status}; to add it: ${install}."
    not_found_path: "not_found: {name} v{version} has no file {path}. Nothing was changed; its files are listed in a read with include files."
    not_found_path_cli: "not_found: {name} v{version} has no file {path}. Nothing was changed; its files are listed by ${cli} read {name} --files."
    not_found_version: "not_found: {name} has no v{version}; the latest is v{latest}. Nothing was changed. Next: read it without a version, or ${versions} to see every version."
    not_found_version_cli: "not_found: {name} has no v{version}; the latest is v{latest}. Nothing was changed. To see every version: ${cli} versions {name}"
    not_found_token: "not_found: no token of the signed-in person has the id {id}, so nothing was revoked. list_tokens shows the ids of their tokens."
    invalid_manifest: "invalid_manifest: {folder}/SKILL.md {problem}. Nothing was published. Fix: {fix} Then preview again."
    why:
      not_json: isn't valid JSON
      wrong_shape: doesn't have the fields skills-catalog expects
      unknown_policy: names an update setting other than auto, notify or pin
      not_a_budget: has a context_cost_budget that isn't a positive whole number (it can't turn the size check off)
      empty: is empty
      not_utf8: isn't valid UTF-8 text
      control_character: contains a line break or another control character (it must be one line)
      invisible_character: contains an invisible or unusual space character
      not_portable: "has a character or name Windows can't store (< > : \" | ? *, a trailing dot or space, or a reserved name like CON or NUL)"
      backslash: uses a backslash (paths use /)
      absolute: is an absolute path (paths start at the skill's folder)
      empty_segment: has an empty part (//)
      dot_segment: has a . or .. part
      git_folder: is inside a .git folder
      not_regular_file: isn't a plain file (a link, a file with more than one hard link, or a special file), so it wasn't read
      memory_file: is a file an assistant would read as a project's own instructions (a CLAUDE.md, CLAUDE.local.md or AGENTS.md)
      claude_folder: is inside a .claude folder, which holds an assistant's own settings and is never part of a skill
      plugin_folder: is inside a .claude-plugin folder, which would make Claude Code load the skill as a plugin that starts hooks and servers in every session
      segment_too_long: has a folder or file name that is too long
      too_long: is too long
      bad_mode: has a file mode other than 0644 or 0755
      duplicate: appears twice
      case_clash: differs from another path only in upper or lower case
      file_is_folder: is inside a path that is also a file
      bad_characters: has characters other than lowercase letters, digits and single hyphens
      differs_from_front_matter: isn't the name in the skill's SKILL.md front matter
      reserved: is already used by Claude Code (a bundled skill, a built-in command, or skills-catalog itself), and a skill with that name would take its place
      not_text: isn't text
      not_one_of: isn't one of the allowed values
      not_integer: isn't a whole number
      too_low: is too low
      too_high: is too high
      not_boolean: isn't true or false
      not_list: isn't a list
      too_many: has too many items
      item_too_long: has an item longer than the limit
      not_object: isn't a set of named fields
      unknown_field: isn't a field this tool takes
      unknown_field_cut: isn't a field this tool takes (its name is cut here to its first 200 characters)
      required: is required
      contradicting_flags: was set by two flags that contradict each other (use one)
      not_a_confirm: isn't a confirm value a preview gives
      not_a_held_confirm: isn't one a held install or update gives
      not_a_cursor: isn't a cursor an earlier page gave
      not_a_developer_name: isn't a valid developer name (lowercase letters, digits and single hyphens)
      not_base64: isn't base64 text
      not_sha256: isn't a file's SHA-256 (64 lowercase hexadecimal characters)
      name_and_names: can't be given together with name (use one of them)
      paths_need_one_name: work only with one name, not names (read the other skills' files in their own calls)
      fingerprint_or_name_and_version: goes alone (give a fingerprint, or a name and a version, not both)
      not_a_catalog_url: isn't a local folder or a catalog address
      not_absolute: isn't an absolute path
      not_a_catalog: has no catalog in it
      catalog_unreadable: couldn't be opened
      hosted_not_available: is a hosted catalog, which this version doesn't support yet
      read_only: "publishing isn't turned on here: start skills-catalog serve with --publish to allow it"
      token_only: can't be used with a hosted catalog, where who is acting comes only from the sign-in token (leave the header out)
      not_uploaded: "names a file that hasn't been uploaded yet: upload it through the links request_upload_links gives, then publish again"
      size_mismatch: "asks for the same file (SHA-256) as an earlier entry but gives a different size: one file has one size"
      not_a_token_id: isn't a token id (list_tokens shows the ids; the value sent isn't repeated here)
      read_scope: this sign-in token can only read; publishing, or revoking a publish token, needs a token with the publish scope
    invalid_manifest_problem:
      missing: is missing
      name: has no name in its front matter
      description: has no description in its front matter
      body: has no instructions below its front matter (the body is empty)
      name_not_text: has a name that YAML reads as a number or true/false, not as text
      missing_several: is missing {fields}
      bad_name: has a name that isn't lowercase letters, digits and single hyphens (64 at most)
      missing_fields: is missing required fields in its front matter
      not_utf8: isn't valid UTF-8 text
      no_front_matter: has no front matter (the block between --- lines at the top)
      invalid_yaml: has front matter that isn't valid YAML
      front_matter_not_a_mapping: "has front matter that isn't a set of key: value lines"
      description_not_text: has a description that isn't plain text
      description_too_long: has a description longer than 1024 characters
      description_angle_brackets: has < or > in its description
      control_character: has a line break or control character in its description, which must be one line
      metadata_not_a_mapping: "has a metadata field that isn't a set of key: value lines"
      tags_not_a_string: has tags that aren't one comma-separated line (metadata.tags)
      bad_tag: has a tag that isn't 1-32 lowercase letters, digits and hyphens, or an empty item between commas
      too_many_tags: has more than 10 tags
      yaml_feature: has front matter that uses {feature}, which YAML parsers read differently
      key_format: has a front matter key, {field}, with characters other than lowercase letters, digits, - and _ (often an invisible character)
    yaml_feature_words:
      merge_key: a merge key (<<)
      anchor: an anchor (&name)
      alias: an alias (*name)
      tag: a custom tag (!something)
      duplicate_key: the same key twice
      multiple_documents: more than one YAML document (a second --- line)
    invalid_manifest_field_words:
      name: a name
      description: a one-line description
      body: instructions below the front matter
    list_and: "{items} and {last}"
    invalid_manifest_fix:
      missing: the folder needs a SKILL.md with a name and a description in its front matter; ask the person to add one, or offer to draft it with them.
      name: suggest a name to the person (lowercase words joined by hyphens, like {suggestion}) and add it to the front matter once they agree.
      description: propose a one-line description to the person (what the skill does, and when to use it); add it to the front matter only once they agree.
      body: propose the skill's instructions to the person (what the assistant should do, step by step) and add them below the front matter only once they agree.
      name_no_suggestion: suggest a name to the person (lowercase words joined by hyphens) and add it to the front matter once they agree.
      name_not_text: "propose the name written as text to the person (in quotes, or as lowercase words joined by hyphens); change it only once they agree."
      missing_several: "propose what's missing to the person ({fields}); add it only once they agree."
      bad_name: suggest {suggestion} to the person and change the front matter once they agree.
      missing_fields: propose the missing fields to the person (a name, and a one-line description of what the skill does and when to use it); add them only once they agree.
      not_utf8: ask the person to save SKILL.md as UTF-8 text; offer to convert it, and do it only once they agree.
      no_front_matter: propose a front matter block with a name and a one-line description to the person; add it only once they agree.
      invalid_yaml: show the person the front matter and propose a correction; change it only once they agree.
      front_matter_not_a_mapping: "show the person the front matter and propose it as key: value lines; change it only once they agree."
      description_not_text: propose the description as one plain line to the person; change it only once they agree.
      description_too_long: propose a shorter description to the person (what the skill does, and when to use it); change it only once they agree.
      description_angle_brackets: propose the description without < and > to the person; change it only once they agree.
      control_character: propose the description rewritten as one line to the person; change it only once they agree.
      metadata_not_a_mapping: "show the person the metadata field and propose it as key: value lines; change it only once they agree."
      tags_not_a_string: "propose the tags as one line under metadata, like `tags: git, release`, to the person; change it only once they agree."
      bad_tag: show the person which tag breaks the rule and propose a fixed one; change it only once they agree.
      too_many_tags: ask the person which 10 tags to keep; change them only once they agree.
      yaml_feature: "show the person the front matter and propose it written plainly (key: value lines, each key once); change it only once they agree."
      key_format: show the person that key and propose retyping it plainly; change it only once they agree.
    exists_untracked: "exists_untracked: {path} already exists and wasn't installed from the catalog, so it was left alone. Ask the user whether to remove or rename it, or install into the other target."
    secret_suspected: "secret_suspected: {path} line {line} looks like {kind}. Nothing was published. Tell the person where it is (not the value itself): to publish, they remove it from {path} line {line} and publish again. If it isn't a secret, there's no way yet to allow it. Do not try to get around it."
    secret_kind:
      aws_access_key: an AWS access key
      private_key: a private key
      github_token: a GitHub token
      slack_token: a Slack token
      anthropic_key: an Anthropic API key
      openai_key: an OpenAI API key
      stripe_key: a Stripe API key
      google_api_key: a Google API key
      jwt: a sign-in token (a JWT)
      url_credentials: a URL with a password in it
      gitlab_token: a GitLab token
      huggingface_token: a Hugging Face token
      sendgrid_key: a SendGrid API key
      npm_token: an npm token
      google_oauth_token: a Google sign-in token
      pgpass_line: a line of a PostgreSQL password file
      password_or_token: a password or token
    publish_conflict: "conflict: something the preview showed has changed since (the folder's files, the message or the latest version), so nothing was published. Preview again and show the person the new lists."
    conflict: "conflict: {name} has a newer version (v{latest}) than the one this change started from, so nothing was published. Read v{latest}, tell the person what changed, and ask how to go on."
    accept_conflict: "conflict: the update held for {name} changed since the person was told about it, so nothing was installed. Run ${update} again and tell them the new reasons."
    accept_flags_conflict: "conflict: the flags given for {name} aren't the ones it is held for ({flags}), so nothing was installed. Show the person these reasons again, and only if they agree call ${accept} again with exactly these flags."
    not_owner: "not_owner: {name} belongs to {owners}; only they publish new versions of it, so nothing was published. Tell the person: they can ask {owners} to publish the change, or publish it as a new skill under another name (propose one; use it only once they agree)."
    invalid_name: "invalid_name: the name \"{name}\" {why}, so it can't be a skill name. Names are lowercase letters, digits and single hyphens, at most 64 characters. Nothing was published. Propose a valid name to the person and use it only once they agree."
    invalid_name_lookup: "invalid_name: \"{name}\" {why}, so no skill has that name.{suggest} Nothing was changed. Next: ${search} with words from the task, or use one of the names above."
    invalid_name_lookup_cli: "invalid_name: \"{name}\" {why}, so no skill has that name.{suggest} Nothing was changed. Next: search the catalog with a few words from the task."
    invalid_path_not_regular: "invalid_path: {path} isn't a plain file (a link, a file with more than one hard link, or a special file), so it wasn't read and nothing was published. Tell the person which file it is and propose replacing it with a plain copy of the file it points to (cp makes a new one); change it only once they agree."
    invalid_path: "invalid_path: {path} {why}, so nothing was published. Tell the person which file or folder it is and propose moving or removing it; change it only once they agree."
    too_large: "too_large: {limit} is {value}, over the limit of {max}, so nothing was published. Tell the person; they decide what to leave out (for example large examples or generated files)."
    too_large_limit:
      files: the number of files
      file_bytes: the size of one file
      skill_bytes: the size of the whole skill
    invalid_request: "invalid_request: {field} {why}, so nothing was done. Correct the call and try again."
    catalog_unreachable: "catalog_unreachable: the catalog at {catalog} couldn't be reached ({detail}), so nothing was done. This is the network or the catalog's address (the SKILLS_CATALOG setting), not a bug. Tell the person what to check; try once more later."
    invalid_request_cli: "invalid_request: {field} {why}, so nothing was done. Correct the command and run it again."
    invalid_request_limit: "invalid_request: {field} {why}; the limit is {limit}. Nothing was done: call again within it (for example in batches)."
    invalid_request_budget: "invalid_request: the context_cost_budget setting must be a positive whole number of estimated tokens (the default is 5000), so setup changed nothing: a budget can't turn the size check off. Tell the person, and use a number only once they agree."
    invalid_request_install_dir: "invalid_request: SKILLS_INSTALL_DIR, the setting for where installed skills go, isn't an absolute path, so nothing was done. Tell the person: they set it to a full path, or unset it to use the default. Don't change it yourself."
    invalid_request_allowed: "invalid_request: {field} {why}: {allowed}. Nothing was done: call again with one of them."
    invalid_request_allowed_cli: "invalid_request: {field} {why}: {allowed}. Nothing was done: run it again with one of them."
    invalid_request_limit_cli: "invalid_request: {field} {why}; the limit is {limit}. Nothing was done: run it again within it (for example in batches)."
    invalid_request_catalog: "invalid_request: there's no catalog at {path}, the place SKILLS_CATALOG or --catalog names, so nothing was read. Most likely the path is mistyped. Tell the person so they can check it; don't change that setting or create anything there yourself. If they meant a new catalog, publishing their first skill to it creates it."
    invalid_request_catalog_unreadable: "invalid_request: the catalog at {path} is there but couldn't be opened (its permissions don't allow it, it's in the middle of a change in a folder this user can't write, or the file isn't laid out as a catalog should be), so nothing was read or changed. Tell the person so they can check it; if it may be mid-change, try once more after a moment. Don't change permissions or anything in that folder yourself."
    unauthenticated: "unauthenticated: the catalog needs the person to sign in, so nothing was done. Ask them to run ${cli} login in their own terminal; never ask for a password or token in the chat."
    invalid_developer_setting: "invalid_developer_setting: the developer name in {setting} isn't a valid name (lowercase letters, digits and single hyphens), so nothing was done. It's a setting, not something in this call: don't retry or change the call. Tell the person; they fix it there, or run ${cli} setup in their own terminal."
    developer_setting:
      SKILLS_AS: the SKILLS_AS setting
      mcp_config: this assistant's settings for ${cli}
      me: the settings saved by ${cli} setup
    unauthenticated_local: "unauthenticated: no developer name is set for this catalog, so nothing was published. Tell the person; they set theirs by running ${cli} setup in their own terminal. Never choose a name for them."
    forbidden: "forbidden: the catalog doesn't allow this for the person signed in, so nothing was done. Tell them; don't look for another way around it."
    forbidden_hosted: "forbidden: {catalog} is a hosted catalog, and this version runs locally only, so nothing was done. Tell the person; ${cli} setup points it at a local folder."
    forbidden_read_only: "forbidden: publishing isn't turned on here (this page's server was started without --publish), so nothing was published. To allow it, stop the server and start it again with ${cli} serve --publish."
    forbidden_read_scope: "forbidden: the sign-in token in use can only read, so nothing was changed. Publishing, or revoking a publish token, needs a token with the publish scope: tell the person; don't look for another token yourself."
    forbidden_too_many_tokens: "forbidden: this person already has {limit} live catalog tokens (not revoked, not expired), so no sign-in was made and no token was issued. Revoking some makes room: list_tokens shows their ids and revoke_token revokes one by id. Tell the person; don't revoke any yourself."
    port_in_use: "port_in_use: port {port} is already in use on this machine, so the server didn't start. Choose another with --port, or leave --port out to take a free one."
    person_only_serve: "serve runs only in the person's own terminal: it serves the catalog's API on this machine and prints a private link with its pairing code, so nothing was started. Give them the command to run there: {command}"
    internal_error: "internal_error: this tool (${cli}) hit a bug (the details are in {log}). The bug is in ${cli}, not in the person's setup: nothing on this machine needs fixing, and don't edit ${cli}'s files. Tell the person, and give them the log's path."
    fingerprint_mismatch: "fingerprint_mismatch: the files the catalog sent for {name} v{version} don't match that version's fingerprint, so the catalog's copy is damaged or has been altered. Nothing was written on this machine, and any copy already installed stays as it was. It isn't something the person did, and it isn't a bug in ${cli}: don't retry or work around it. Tell the person, so whoever runs the catalog can check it."
    internal_error_no_log: "internal_error: this tool (${cli}) hit a bug, and couldn't write its log either. The bug is in ${cli}, not in the person's setup: nothing on this machine needs fixing, and don't edit ${cli}'s files. Tell the person."
    name_in_use: "name_in_use: {path} already holds a skill with this name that wasn't installed from the catalog, and installing this one as well would replace it for the assistant, so nothing was installed. Tell the person; they decide whether to rename or remove theirs."
    name_in_use_command: "name_in_use: {path} is a command with this name, and a skill with the same name would replace it for the assistant, so nothing was installed. Tell the person; they decide whether to rename or remove the command."
    person_only: "This step needs the person: it asks them to confirm in their own terminal, so nothing was done. Give them the command to run there: {command}"
    target_symlink: "target_symlink: {path} is a link to somewhere else, so the installer won't install through it. Nothing was changed. Tell the person; they decide whether to replace the link."
    target_changed: "target_changed: {path} changed while the installer was replacing it (something else was put there in between), so nothing was installed, and the folder it had moved aside is back in place. This may not be the person's doing. Don't retry or work around it: tell the person, so they can check {path} first."
    target_changed_staging: "target_changed: {path} changed while the installer was replacing it (something else was put there in between), so nothing was installed. The folder it had moved aside couldn't be put back: it is now at {staging}. This may not be the person's doing. Don't retry or move anything yourself: tell the person where both are, so they can check {path} and put their copy back."
    target_changed_temp: "target_changed: the folder the installer was preparing the new copy in, {path}, changed while it was being written (something else was put there), so nothing was installed and nothing already installed was touched. This may not be the person's doing. Don't retry or work around it: tell the person, so they can check {path}."
    target_changed_elsewhere: " A copy of the skill may also have been written outside the skills folder, wherever a link swapped in there pointed; the installer can't tell where, so it couldn't remove it. Ask the person to look for it."
    target_not_private: "target_not_private: other people on this machine could change {path}, and the installer writes through it, so nothing was installed. Tell the person, propose making it private with chmod go-w {path}, and run it only once they agree."
    target_not_private_not_own: "target_not_private: {path} isn't the person's own and others on this machine can change it, so the installer won't install through it and nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (${install} with target \"project\"). Propose one, and do it only once they agree."
    target_not_private_not_own_cli: "target_not_private: {path} isn't the person's own and others on this machine can change it, so the installer won't install through it and nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (the same install command with --project). Propose one, and do it only once they agree."
    target_not_private_home: "target_not_private: other people on this machine could change the person's home folder, {path}, and the installer writes under it, so nothing was installed. Tell the person; there are three ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, install into this project instead (${install} with target \"project\"), or make the home folder private with chmod go-w {path}, which affects everything in it, not only skills. Propose one, and do it only once they agree."
    target_not_private_home_cli: "target_not_private: other people on this machine could change the person's home folder, {path}, and the installer writes under it, so nothing was installed. Tell the person; there are three ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, install into this project instead (the same install command with --project), or make the home folder private with chmod go-w {path}, which affects everything in it, not only skills. Propose one, and do it only once they agree."
    target_not_private_home_not_own: "target_not_private: the home folder here, {path}, isn't the person's own and others can change it (as in CI or a container), so the installer won't install under it and nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (${install} with target \"project\"). Propose one, and do it only once they agree."
    target_not_private_home_not_own_cli: "target_not_private: the home folder here, {path}, isn't the person's own and others can change it (as in CI or a container), so the installer won't install under it and nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (the same install command with --project). Propose one, and do it only once they agree."
    target_not_private_project: "target_not_private: other people on this machine could change {path}, and the installer writes through it, so nothing was installed. Tell the person. In a shared project that may be the team's choice, so there are two ways on: install it to their own skills folder instead (${install} with target \"user\"), or make the folder private with chmod go-w {path}. Propose one, and do it only once they agree."
    target_not_private_project_cli: "target_not_private: other people on this machine could change {path}, and the installer writes through it, so nothing was installed. Tell the person. In a shared project that may be the team's choice, so there are two ways on: install it to their own skills folder instead (the same install command without --project), or make the folder private with chmod go-w {path}. Propose one, and do it only once they agree."
    target_not_private_project_not_own: "target_not_private: {path} isn't the person's own and others on this machine can change it, so the installer won't install through it and nothing was installed. Tell the person; the way on is to install it to their own skills folder instead (${install} with target \"user\"). Propose it, and do it only once they agree."
    target_not_private_project_not_own_cli: "target_not_private: {path} isn't the person's own and others on this machine can change it, so the installer won't install through it and nothing was installed. Tell the person; the way on is to install it to their own skills folder instead (the same install command without --project). Propose it, and do it only once they agree."
    target_unavailable: "target_unavailable: {path} doesn't exist and the installer couldn't make it (it may lack permission, the disk may be read-only, or a file may stand where a folder should be), so nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (${install} with target \"project\"). Propose one, and do it only once they agree; don't make or remove folders yourself."
    target_unavailable_cli: "target_unavailable: {path} doesn't exist and the installer couldn't make it (it may lack permission, the disk may be read-only, or a file may stand where a folder should be), so nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (the same install command with --project). Propose one, and do it only once they agree; don't make or remove folders yourself."
    target_unavailable_home: "target_unavailable: the home folder here, {path}, doesn't exist and can't be made (as in CI or a container without one), so nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (${install} with target \"project\"). Propose one, and do it only once they agree."
    target_unavailable_home_cli: "target_unavailable: the home folder here, {path}, doesn't exist and can't be made (as in CI or a container without one), so nothing was installed. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to a folder of their own, or install into this project instead (the same install command with --project). Propose one, and do it only once they agree."
    target_unavailable_project: "target_unavailable: {path} doesn't exist and the installer couldn't make it (it may lack permission, the disk may be read-only, or a file may stand where a folder should be), so nothing was installed. Tell the person; the way on is to install it to their own skills folder instead (${install} with target \"user\"). Propose it, and do it only once they agree; don't make or remove folders yourself."
    target_unavailable_project_cli: "target_unavailable: {path} doesn't exist and the installer couldn't make it (it may lack permission, the disk may be read-only, or a file may stand where a folder should be), so nothing was installed. Tell the person; the way on is to install it to their own skills folder instead (the same install command without --project). Propose it, and do it only once they agree; don't make or remove folders yourself."
    lock_busy: "lock_busy: another run of this tool (process {pid}) is changing the installed skills, so nothing was changed. Try once more in a moment. Don't delete or edit the lock file: a stale one is taken over by itself. If it keeps happening, tell the person."
    lock_busy_unusable: "lock_busy: the lock file at {path} isn't one this tool can clear (it belongs to another user, or it isn't an ordinary file), so nothing was changed. Tell the person to look at it; don't delete, move or edit it yourself."
    invalid_local_file_key: "invalid_local_file: {path} has {key}, which this version can't use (a setting it doesn't know, perhaps misspelled, a key added to safe_frontmatter_keys or non_granting_keys, which the config can only take keys out of, or a value of the wrong type), so nothing was changed. The file is never repaired or rewritten automatically. Tell the person which file and which key (not its value); they decide whether to fix it or remove the file ({effect}). Change it only once they agree."
    invalid_local_file_policy: "invalid_local_file: {path} has {key} set to something other than auto, notify or pin, so nothing was changed. The file is never repaired or rewritten automatically. Tell the person which file and which setting; they decide whether to fix it or remove the file ({effect}). Change it only once they agree."
    invalid_local_file: "invalid_local_file: {path} {why}, so nothing was changed. The file is never repaired or rewritten automatically. Tell the person which file it is and why; they decide whether to fix it or remove it ({effect}). Change it only once they agree."
    local_file_effect:
      lock.json: "removing it loses the record of which skills came from the catalog: their folders stay, but they're no longer updated"
      config.json: removing it puts ${cli}'s settings back to their defaults
      setup-record.json: removing it means teardown can no longer tell setup's entries in the assistant's files from the person's own, so it would remove nothing and they'd have to be removed by hand
    assistant_file_unusable: "assistant_file_unusable: {path} {why}, so setup changed nothing anywhere. Setup never repairs, rewrites or moves the assistant's own files: tell the person which file and why; they decide whether to fix or move it, then run setup again. Don't change the file yourself."
    assistant_file_changed: "assistant_file_changed: something kept changing {path} while setup was writing it (usually a running Claude Code), so setup left it as that writer left it and stopped; the lines above say what was already done. Tell the person: quit Claude Code, then run ${cli} setup again from a terminal to finish."
    name_taken: "name_taken: {path} already has an MCP server named {name} that setup didn't write, or that was changed since setup wrote it, so setup changed nothing. Tell the person; they decide whether to remove or rename that server, or, if it was setup's, to run ${cli} teardown first. Don't edit the file yourself."
    install_unsafe_temporary: "install_unsafe: skills-catalog is running from {path}, a temporary folder that gets cleaned (npx's cache or the system's temp folder), so setup changed nothing: the session-start hook would stop working when it's cleaned. Tell the person: install skills-catalog in a lasting folder of their own, then run setup from there."
    install_unsafe_path_characters: "install_unsafe: {path} has a character setup can't safely put into a command (a control character, $ or a backtick), so setup changed nothing. Tell the person: install skills-catalog (or Node) in a folder whose path doesn't, then run setup from there."
    install_unsafe_writable_by_others: "install_unsafe: {path} can be changed by other users on this machine, and the session-start hook would run the code there each time a session starts, so setup changed nothing. Tell the person: install skills-catalog (or Node) in a folder only they can change, then run setup from there. Don't change permissions yourself."
    install_unsafe_too_many_files: "install_unsafe: skills-catalog's installed files at {path} are too many, or nested too deep, for setup to check them all, and the session-start hook would run them each time a session starts, so setup changed nothing. Tell the person: install skills-catalog somewhere with an ordinary package tree (for example a fresh clone, then npm ci), then run setup from there. Don't delete or move files yourself."
    assistant_config_elsewhere: "assistant_config_elsewhere: {setting} is set, so Claude Code may keep its settings and MCP servers somewhere other than where setup would write, and setup changed nothing. Tell the person; there are two ways on: set SKILLS_ASSISTANT_HOME to the folder Claude Code really uses and run setup again, or add the entries below by hand."
  person:
    list:
      title: "Installed from the shared catalog: {n}"
      same: latest
      behind: v{latest} available
      behind_auto: v{latest} available, updates on its own
      edited: changed here
      project: this project only
      columns: " | Skill | Installed | Latest | Where | Updates"
      empty_reply: Nothing from the shared catalog is installed here yet.
      next_behind: "To update: ${update}"
      empty: "Nothing from the shared catalog is installed here yet. Find a skill: ${search}"
    search:
      header: '{count} of {total} skills match "{query}"'
      header_all: "The shared catalog: {total} skills"
      header_page: "The shared catalog: {total} skills, showing {first} to {last}"
      partial: 'Nothing matches every word of "{query}". Closest, sharing only some words:'
      shares: "shares only: {words}"
      also: "Not matches, sharing only some words:"
      review: "Review: {notes}"
      empty: 'No skill matches "{query}" ({total} in the catalog). Try other words: ${search}'
      empty_catalog: The shared catalog is empty. Nobody has published a skill yet.
      empty_reply: 'No skill matches "{query}" ({total} in the catalog).'
      columns: "Skill | Version | Publisher | What it does"
      columns_partial: "Skill | Version | Publisher | Shares only | What it does"
