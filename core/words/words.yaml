    held_other_catalog_cli: "{name} v{version} was NOT installed yet: the {name} here came from another catalog ({was}) and this one comes from {now}, so it may be a different skill that shares the name.{also} Tell the person. Don't install it yourself: the person does, by running {command} in their own terminal."
    held_over: '{name} v{version} was NOT installed: {name} v{from} is installed here, and v{version} can run things on this machine without asking, because {reasons}. Tell the person each reason in plain words and ask whether to take v{version}. Only if they agree: ${accept} with name "{name}", target "{target}", version {version}, confirm "{confirm}" and flags {flags}, all exactly as given here.'
    held_over_cli: "{name} v{version} was NOT installed: {name} v{from} is installed here, and v{version} can run things on this machine without asking, because {reasons}. Tell the person each reason in plain words. Don't install it yourself: the person does, by running {command} in their own terminal."
    held_files: '{name} v{version} was NOT installed yet: it includes files that are not plain instructions ({reasons}), and the person decides whether those reach this machine. Tell the person each reason in plain words and ask whether to install it. Only if they agree: ${accept} with name "{name}", target "{target}", version {version}, confirm "{confirm}" and flags {flags}, all exactly as given here.'
    held_files_cli: "{name} v{version} was NOT installed yet: it includes files that are not plain instructions ({reasons}), and the person decides whether those reach this machine. Tell the person each reason in plain words. Don't install it yourself: the person does, by running {command} in their own terminal."
