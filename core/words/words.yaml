    done: "Installed {name} v{version} to {path} (fingerprint checked). Updates: {policy}."
    unchanged: "{name} v{version} is already installed here and unchanged, so nothing was written."
    older_auto: 'This is an earlier version (the latest is v{latest}), and its updates are automatic, so the next update moves it to v{latest}. Tell the person; to keep v{version}: ${policy} with policy "pin" and name "{name}".'
    older_auto_cli: "This is an earlier version (the latest is v{latest}), and its updates are automatic, so the next update moves it to v{latest}. To keep v{version}: ${cli} policy pin {name}."
