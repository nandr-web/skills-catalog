# The AWS stand-in the hosted adapters' tests run against: moto in server mode, on 127.0.0.1 only (test/emulator.ts).
# Wheels only (uv --no-build); never deployed, never run outside the tests.
[project]
name = "skills-catalog-emulator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["moto[server]==5.2.3"]

[tool.uv]
package = false
