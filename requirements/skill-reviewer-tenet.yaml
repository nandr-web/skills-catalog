id: skill-reviewer-tenet
title: Skill reviewers measure, not nit-pick
phase: "1"
source: "the owner's notes on the PRD"
want: "As a skill submitter, I want reviewers to measure, ground every finding and add notes only when they help, and to approve without comments when a skill is good, so that reviews don't add unnecessary toil."
confirmed: true
relates: [skill-quality-reviews, skill-review-flags]
