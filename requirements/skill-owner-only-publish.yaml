id: skill-owner-only-publish
title: "Only a skill's owners can publish it"
phase: "1"
source: "the owner's decision on who may publish"
quote: "only owners can publish"
want: "As Developer 1, I want only a skill's owners to be able to publish it, so that no one else can change what my skill's subscribers get."
accept: "Locally, in the core: the first publisher owns the name; a publish of that name by anyone else returns a clear not-owner error naming the owners, and stores nothing; the recorded publisher is always the acting identity."
confirmed: true
relates: [skill-demo-identity, skill-owner-permissions]
