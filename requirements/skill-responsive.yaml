id: skill-responsive
title: "Fast enough to feel interactive"
phase: "1"
source: "the PRD, Non-functional requirements"
quote: "Discovery and retrieval are fast enough to feel interactive within an assistant conversation."
want: "As Developer 2, I want discovery and retrieval to be fast enough to feel interactive within an assistant conversation, so that asking my assistant is quicker than asking a colleague."
accept: "Observed during a normal exchange (the PRD's method), plus the QA plan's budgets: local search p95 ≤ 100 ms at 10,000 skills, hosted search p95 ≤ 300 ms warm and ≤ 1.5 s for the first query after idle."
confirmed: true
