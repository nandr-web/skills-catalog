id: skill-discover
title: "Discover skills through an AI assistant"
phase: "1"
source: "the PRD, FR-02"
quote: "As Developer 2, I want to ask my AI assistant what skills exist for a need so I can reuse one instead of writing my own."
want: "As Developer 2, I want to ask my AI assistant what skills exist for a need so I can reuse one instead of writing my own."
accept: "From FR-02 and UC-02: through an AI assistant, in natural language, a developer can find published skills that match a described need; each result identifies the skill (at least name and description); when nothing matches, the assistant clearly says so."
confirmed: true
parts: [core, mcp]
relates: [skill-list-get, skill-search-measure]
