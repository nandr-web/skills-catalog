id: skill-setup-welcome
title: "A welcoming setup, from a CLI installer or a prompt"
phase: "1"
source: "the owner's notes on the PRD"
quote: "we'd make it a welcome, intuitive, (colorful) UX that asks you if you want auto-updates on (with a default of yes in case someone wants to run fast / unattended)."
want: "As a developer setting up skill searching and fetching, from a CLI installer or a prompt for an agent, I want a welcome, intuitive, colorful setup that asks if I want auto-updates on (default yes), so that I never need to go into a file or run a CLI to configure it."
accept: "The installer asks once, in colour, with auto-updates defaulting to yes; an agent can run the same setup from a prompt; the file and the CLI exist too; teardown undoes everything setup wrote."
confirmed: true
relates: [skill-setup-unattended, skill-auto-updates]
