id: skill-web-ui
title: "Phase 2: Web UI: view and update skills"
phase: "2"
source: "the owner's notes on the PRD"
quote: "We should make it easy to view and update skills from the UI."
want: "As a developer, I want a web UI where it's easy to view and update skills and inspect their history, so that I don't need an assistant or a CLI to look after them."
accept: "In the web UI a person can browse skills, open one and its history, and edit it; saving publishes a new version, and is refused if someone published since."
confirmed: true
relates: [skill-web-delta, skill-web-mockups]
