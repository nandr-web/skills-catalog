<text class="d-msg-label d-msg-label--alert" x="448.7" y="392.5">adds a file that can run</text>
<text class="d-msg-label" x="448.7" y="426.5">7 publish release-note-draft</text>
<text class="d-msg-label d-msg-label--alert" x="448.7" y="460.5">refused: it belongs to ana</text>
<text class="d-msg-label" x="448.7" y="494.5">8 search &quot;graphql schema&quot;</text>
<text class="d-msg-label d-msg-label--return" x="448.7" y="528.5">nothing exact; closest shares &quot;schema&quot;</text>
