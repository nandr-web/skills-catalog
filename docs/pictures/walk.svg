<text class="d-msg-label" x="178.4" y="86.5">1 publish 2 skills</text>
<text class="d-msg-label" x="448.7" y="120.5">2 search &quot;changelog for a release&quot;</text>
<text class="d-msg-label d-msg-label--return" x="448.7" y="154.5">1 of 2 skills match</text>
<text class="d-msg-label" x="448.7" y="188.5">3 read it</text>
<text class="d-msg-label d-msg-label--return" x="448.7" y="222.5">SKILL.md, marked as data</text>
