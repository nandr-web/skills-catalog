<svg xmlns="http://www.w3.org/2000/svg" class="d d-architecture" viewBox="0 0 711 868" width="711" height="868" role="img" aria-label="What are the parts on the developer's machine, and what talks to what?">
<title>What runs on the developer's machine</title>
<style>.d { --d-page: #ECF0F3; --d-canvas: #F9FBFC; --d-ink: #13202A; --d-ink2: #3A4A56; --d-line: #B7C4CD; --d-grid: #D5DDE3; --d-shade: #E1E7EB; --d-accent: #137052; --d-accent-soft: #D9EDE3; --d-hot: #B23A0A; --d-hot-soft: #F8E2D5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .d, svg.d:root { --d-page: #0E1418; --d-canvas: #151D23; --d-ink: #E3EAEE; --d-ink2: #AFBCC5; --d-line: #3A4A55; --d-grid: #25313A; --d-shade: #1C262D; --d-accent: #46C290; --d-accent-soft: #1C3A2F; --d-hot: #F08A50; --d-hot-soft: #4A2819; color-scheme: dark; }
}
:root[data-theme="dark"] .d { --d-page: #0E1418; --d-canvas: #151D23; --d-ink: #E3EAEE; --d-ink2: #AFBCC5; --d-line: #3A4A55; --d-grid: #25313A; --d-shade: #1C262D; --d-accent: #46C290; --d-accent-soft: #1C3A2F; --d-hot: #F08A50; --d-hot-soft: #4A2819; color-scheme: dark; }

.d { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: var(--d-ink); }
.d text { dominant-baseline: central; }
.d-bg { fill: var(--d-canvas); }

/* nodes */
.d-node { fill: var(--d-canvas); stroke: var(--d-ink); stroke-width: 1.2; }
.d-node--external { fill: var(--d-shade); stroke: var(--d-ink2); stroke-dasharray: 4 3; }
.d-node--focus { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.6; }
.d-node--alert { fill: var(--d-hot-soft); stroke: var(--d-hot); stroke-width: 1.6; }
.d-node-detail { fill: none; stroke: var(--d-ink); stroke-width: 1; }
.d-node--focus + .d-node-detail { stroke: var(--d-accent); }
.d-node--alert + .d-node-detail { stroke: var(--d-hot); }
.d-node--external + .d-node-detail { stroke: var(--d-ink2); }
.d-node--proposed { stroke-width: 1.4; stroke-dasharray: 2 3; }
.d-node--removed { fill: var(--d-canvas); stroke: var(--d-hot); stroke-width: 1.4; stroke-dasharray: 5 3; }
.d-label { fill: var(--d-ink); text-anchor: middle; }
.d-label--strong { font-weight: 600; }
.d-label--removed { fill: var(--d-ink2); text-decoration: line-through; }
.d-tag--proposed { fill: var(--d-canvas); stroke: var(--d-ink); stroke-width: 1; stroke-dasharray: 2 2; }
.d-tag--removed { fill: var(--d-hot); stroke: var(--d-hot); stroke-width: 1; }
.d-tag-text { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-anchor: middle; }
.d-tag-text--proposed { fill: var(--d-ink); }
.d-tag-text--removed { fill: var(--d-canvas); }
.d-legend-text { font-size: 10.5px; fill: var(--d-ink2); }
.d-compare-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; fill: var(--d-ink2); }
.d-callout { fill: var(--d-ink); }
.d-callout-text { font-size: 10px; font-weight: 600; fill: var(--d-canvas); text-anchor: middle; }
.d-note { font-size: 10.5px; fill: var(--d-ink2); text-anchor: middle; }
.d-note--focus { fill: var(--d-accent); }
.d-note--alert { fill: var(--d-hot); }

/* edges */
.d-edge { fill: none; stroke: var(--d-ink); stroke-width: 1.3; stroke-linejoin: round; }
.d-edge--async { stroke-dasharray: 5 4; }
.d-edge--proposed { stroke-dasharray: 2 3; }
.d-edge--removed { stroke: var(--d-hot); stroke-dasharray: 5 3; }
.d-edge--return { stroke: var(--d-ink2); stroke-width: 1.1; stroke-dasharray: 4 3; }
.d-edge--focus { stroke: var(--d-accent); stroke-width: 2; }
.d-edge--alert { stroke: var(--d-hot); stroke-width: 2; }
.d-edge-label { font-size: 10.5px; fill: var(--d-ink2); text-anchor: middle;
  paint-order: stroke; stroke: var(--d-canvas); stroke-width: 4px; stroke-linejoin: round; }
.d-edge-label--focus { fill: var(--d-accent); font-weight: 600; }
.d-edge-label--alert { fill: var(--d-hot); font-weight: 600; }
.d-arrow { fill: var(--d-ink); }
.d-arrow--focus { fill: var(--d-accent); }
.d-arrow--alert { fill: var(--d-hot); }
.d-arrow--muted { fill: var(--d-ink2); }
.d-arrow--open { fill: none; stroke: var(--d-ink); stroke-width: 1.4; stroke-linejoin: round; }
.d-arrow--open.d-arrow--focus { stroke: var(--d-accent); }
.d-arrow--open.d-arrow--alert { stroke: var(--d-hot); }
.d-arrow--open.d-arrow--muted { stroke: var(--d-ink2); }

/* sequence */
.d-lifeline { fill: none; stroke: var(--d-ink2); stroke-width: 1; stroke-dasharray: 3 4; }
.d-activation { fill: var(--d-shade); stroke: var(--d-ink); stroke-width: 1; }
.d-msg-label { font-size: 11px; fill: var(--d-ink); text-anchor: middle; }
.d-msg-label--start { text-anchor: start; }
.d-msg-label--return { fill: var(--d-ink2); }
.d-msg-label--focus { fill: var(--d-accent); font-weight: 600; }
.d-msg-label--alert { fill: var(--d-hot); font-weight: 600; }
.d-memo { fill: var(--d-shade); stroke: var(--d-ink2); stroke-width: 1; }
.d-memo--alert { fill: var(--d-hot-soft); stroke: var(--d-hot); }
.d-memo-text { font-size: 10.5px; fill: var(--d-ink); text-anchor: middle; }
.d-frame { fill: none; stroke: var(--d-ink2); stroke-width: 1.1; }
.d-frame-tab { fill: var(--d-shade); stroke: var(--d-ink2); stroke-width: 1.1; }
.d-frame-kind { font-size: 10.5px; font-weight: 600; fill: var(--d-ink); }
.d-frame-cond-bg { fill: var(--d-canvas); }
.d-frame-cond { font-size: 10.5px; fill: var(--d-ink2); }
.d-frame-sep { fill: none; stroke: var(--d-ink2); stroke-width: 1; stroke-dasharray: 4 3; }

/* state */
.d-pseudo { fill: var(--d-ink); }
.d-choice-label { font-size: 10.5px; fill: var(--d-ink); text-anchor: middle; }
.d-composite { fill: var(--d-grid); fill-opacity: 0.25; stroke: var(--d-ink2); stroke-width: 1.1; }
.d-composite-label { font-size: 11px; font-weight: 600; fill: var(--d-ink); }

/* groups (boundaries) */
.d-group { fill: var(--d-grid); fill-opacity: 0.35; stroke: var(--d-ink2); stroke-width: 1; stroke-dasharray: 4 3; }
.d-group-label { font-size: 10.5px; fill: var(--d-ink2); letter-spacing: 0.06em; font-weight: 500; }</style>
