<svg xmlns="http://www.w3.org/2000/svg" class="st st-sequence" viewBox="0 0 960 616" width="960" height="616" role="img" aria-label="What happens, in order, when Developer 2's Assistant retrieves Developer 1's skill, and Developer 1 then changes it?">
<title>Two developers, one catalog</title>
<style>.st { --st-page: #ECF0F3; --st-canvas: #F9FBFC; --st-ink: #13202A; --st-ink2: #3A4A56; --st-line: #B7C4CD; --st-grid: #D5DDE3; --st-shade: #E1E7EB; --st-accent: #137052; --st-accent-soft: #D9EDE3; --st-hot: #B23A0A; --st-hot-soft: #F8E2D5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .st, svg.st:root { --st-page: #0E1418; --st-canvas: #151D23; --st-ink: #E3EAEE; --st-ink2: #AFBCC5; --st-line: #3A4A55; --st-grid: #25313A; --st-shade: #1C262D; --st-accent: #46C290; --st-accent-soft: #1C3A2F; --st-hot: #F08A50; --st-hot-soft: #4A2819; color-scheme: dark; }
}
:root[data-theme="dark"] .st { --st-page: #0E1418; --st-canvas: #151D23; --st-ink: #E3EAEE; --st-ink2: #AFBCC5; --st-line: #3A4A55; --st-grid: #25313A; --st-shade: #1C262D; --st-accent: #46C290; --st-accent-soft: #1C3A2F; --st-hot: #F08A50; --st-hot-soft: #4A2819; color-scheme: dark; }

.st { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: var(--st-ink); }
.st text { dominant-baseline: central; }
.st-bg { fill: var(--st-canvas); }

/* nodes */
.d-node { fill: var(--st-canvas); stroke: var(--st-ink); stroke-width: 1.2; }
.d-node--external { fill: var(--st-shade); stroke: var(--st-ink2); stroke-dasharray: 4 3; }
.d-node--focus { fill: var(--st-accent-soft); stroke: var(--st-accent); stroke-width: 1.6; }
.d-node--alert { fill: var(--st-hot-soft); stroke: var(--st-hot); stroke-width: 1.6; }
.d-node-detail { fill: none; stroke: var(--st-ink); stroke-width: 1; }
.d-node--focus + .d-node-detail { stroke: var(--st-accent); }
.d-node--alert + .d-node-detail { stroke: var(--st-hot); }
.d-node--external + .d-node-detail { stroke: var(--st-ink2); }
.d-node--proposed { stroke-width: 1.4; stroke-dasharray: 2 3; }
.d-node--removed { fill: var(--st-canvas); stroke: var(--st-hot); stroke-width: 1.4; stroke-dasharray: 5 3; }
.d-label { fill: var(--st-ink); text-anchor: middle; }
.d-label--strong { font-weight: 600; }
.d-label--removed { fill: var(--st-ink2); text-decoration: line-through; }
.st-tag--proposed { fill: var(--st-canvas); stroke: var(--st-ink); stroke-width: 1; stroke-dasharray: 2 2; }
.st-tag--removed { fill: var(--st-hot); stroke: var(--st-hot); stroke-width: 1; }
.st-tag-text { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-anchor: middle; }
.st-tag-text--proposed { fill: var(--st-ink); }
.st-tag-text--removed { fill: var(--st-canvas); }
.st-legend-text { font-size: 10.5px; fill: var(--st-ink2); }
.st-compare-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; fill: var(--st-ink2); }
.st-callout { fill: var(--st-ink); }
.st-callout-text { font-size: 10px; font-weight: 600; fill: var(--st-canvas); text-anchor: middle; }
.st-note { font-size: 10.5px; fill: var(--st-ink2); text-anchor: middle; }
.st-note--focus { fill: var(--st-accent); }
.st-note--alert { fill: var(--st-hot); }

/* edges */
.d-edge { fill: none; stroke: var(--st-ink); stroke-width: 1.3; stroke-linejoin: round; }
.d-edge--async { stroke-dasharray: 5 4; }
.d-edge--proposed { stroke-dasharray: 2 3; }
.d-edge--removed { stroke: var(--st-hot); stroke-dasharray: 5 3; }
.d-edge--return { stroke: var(--st-ink2); stroke-width: 1.1; stroke-dasharray: 4 3; }
.d-edge--focus { stroke: var(--st-accent); stroke-width: 2; }
.d-edge--alert { stroke: var(--st-hot); stroke-width: 2; }
.d-edge-label { font-size: 10.5px; fill: var(--st-ink2); text-anchor: middle;
  paint-order: stroke; stroke: var(--st-canvas); stroke-width: 4px; stroke-linejoin: round; }
.d-edge-label--focus { fill: var(--st-accent); font-weight: 600; }
.d-edge-label--alert { fill: var(--st-hot); font-weight: 600; }
.d-arrow { fill: var(--st-ink); }
.d-arrow--focus { fill: var(--st-accent); }
.d-arrow--alert { fill: var(--st-hot); }
.d-arrow--muted { fill: var(--st-ink2); }
.d-arrow--open { fill: none; stroke: var(--st-ink); stroke-width: 1.4; stroke-linejoin: round; }
.d-arrow--open.d-arrow--focus { stroke: var(--st-accent); }
.d-arrow--open.d-arrow--alert { stroke: var(--st-hot); }
.d-arrow--open.d-arrow--muted { stroke: var(--st-ink2); }

/* sequence */
.st-lifeline { fill: none; stroke: var(--st-ink2); stroke-width: 1; stroke-dasharray: 3 4; }
.st-activation { fill: var(--st-shade); stroke: var(--st-ink); stroke-width: 1; }
.st-msg-label { font-size: 11px; fill: var(--st-ink); text-anchor: middle; }
.st-msg-label--start { text-anchor: start; }
.st-msg-label--return { fill: var(--st-ink2); }
.st-msg-label--focus { fill: var(--st-accent); font-weight: 600; }
.st-msg-label--alert { fill: var(--st-hot); font-weight: 600; }
.st-memo { fill: var(--st-shade); stroke: var(--st-ink2); stroke-width: 1; }
.st-memo--alert { fill: var(--st-hot-soft); stroke: var(--st-hot); }
.st-memo-text { font-size: 10.5px; fill: var(--st-ink); text-anchor: middle; }
.st-frame { fill: none; stroke: var(--st-ink2); stroke-width: 1.1; }
.st-frame-tab { fill: var(--st-shade); stroke: var(--st-ink2); stroke-width: 1.1; }
.st-frame-kind { font-size: 10.5px; font-weight: 600; fill: var(--st-ink); }
.st-frame-cond-bg { fill: var(--st-canvas); }
.st-frame-cond { font-size: 10.5px; fill: var(--st-ink2); }
.st-frame-sep { fill: none; stroke: var(--st-ink2); stroke-width: 1; stroke-dasharray: 4 3; }

/* state */
.st-pseudo { fill: var(--st-ink); }
.st-choice-label { font-size: 10.5px; fill: var(--st-ink); text-anchor: middle; }
.st-composite { fill: var(--st-grid); fill-opacity: 0.25; stroke: var(--st-ink2); stroke-width: 1.1; }
.st-composite-label { font-size: 11px; font-weight: 600; fill: var(--st-ink); }

/* groups (boundaries) */
.st-group { fill: var(--st-grid); fill-opacity: 0.35; stroke: var(--st-ink2); stroke-width: 1; stroke-dasharray: 4 3; }
.st-group-label { font-size: 10.5px; fill: var(--st-ink2); letter-spacing: 0.06em; font-weight: 500; }</style>
